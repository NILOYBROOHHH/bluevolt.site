    // Turn a Supabase (Google / email) sign-in into a store session on this device
    function applySupabaseSession(sbUser) {
      const email = normalizeEmail(sbUser && sbUser.email);
      if (!email) return;
      if (state.currentUser && normalizeEmail(state.currentUser.email) === email && !state.authModal) return;
      const meta = (sbUser && sbUser.user_metadata) || {};
      const displayName = meta.full_name || meta.name || email.split('@')[0];
      if (!Array.isArray(state.users)) state.users = [];
      let existing = state.users.find((u) => normalizeEmail(u.email) === email);
      if (!existing) {
        existing = { id: 'u-' + (sbUser.id || Date.now()), email, fullName: displayName, roles: [], password: '' };
        state.users.push(existing);
      } else if (!existing.fullName) {
        existing.fullName = displayName;
      }
      const roles = Array.isArray(existing.roles) ? existing.roles : [];
      if (state.exclusiveOwnerOnlyMe && roles.includes('owner') && !canReceiveOwnerRole(existing.email)) {
        existing.roles = roles.filter((r) => r !== 'owner');
      }
      const effectiveRoles = Array.isArray(existing.roles) ? existing.roles : [];
      state.currentUser = { email: existing.email, fullName: existing.fullName };
      if (effectiveRoles.includes('owner') && canReceiveOwnerRole(existing.email)) state.activeRole = 'owner';
      else if (effectiveRoles.includes('admin')) state.activeRole = 'admin';
      else if (effectiveRoles.includes('stock_manager')) state.activeRole = 'stock_manager';
      else if (effectiveRoles.includes('order_manager')) state.activeRole = 'order_manager';
      else state.activeRole = 'customer';
      state.authModal = null;
      saveState();
      if (/access_token=|code=|error_description=/.test(window.location.hash + window.location.search)) {
        history.replaceState(null, '', window.location.pathname);

      render();
      showToast(`Signed in as ${existing.email}.`, 'success');

            .order('sort_key', { ascending: !col.newestFirst });
          if (error) {
            console.error(`Could not load ${col.key}:`, error.message);
            continue;
          }
          const snap = {};
          if (data && data.length) {
            let items = data.map((r) => r.data);
            if (col.key === 'products') {
              items = items.map((p) => {
                const st = getProductStatus(p);
                return { ...p, status: st, isActive: st !== 'inactive' };
              });
            }
            state[col.key] = items;
            items.forEach((item) => { snap[item.id] = JSON.stringify(item); });
            changed = true;
          }
          sharedSnapshot[col.key] = snap;
        } catch (err) {
          console.error(`Could not load ${col.key}:`, err);
        }
      }
      if (changed) {
        if (Array.isArray(state.cart)) {
          state.cart = state.cart.filter((i) => !i.productId || state.products.some((p) => p.id === i.productId));
        }
        persistLocalCache();
        renderKeepingInput();
      }
      scheduleSharedSync();
    }

    // Redraw after background data arrives without wiping what the visitor is typing
    function renderKeepingInput() {
      const app = document.getElementById('app');
      if (!app) return render();
      const saved = [];
      app.querySelectorAll('input[id], textarea[id], select[id]').forEach((el) => {
        if (el.type === 'file' || el.type === 'password') return;
        saved.push({ id: el.id, value: el.type === 'checkbox' || el.type === 'radio' ? null : el.value, checked: el.checked });
      });
      const active = document.activeElement;
      const focusId = active && app.contains(active) ? active.id : '';
      let selStart = null, selEnd = null;
      try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (e) {}
      const scrollY = window.scrollY;
      render();
      saved.forEach((s) => {
        const el = document.getElementById(s.id);
        if (!el) return;
        if (s.value === null) el.checked = s.checked;
        else if (el.value !== s.value) el.value = s.value;
      });
      if (focusId) {
        const el = document.getElementById(focusId);
        if (el) {
          el.focus({ preventScroll: true });
          try {
            if (selStart !== null && selStart !== undefined) el.setSelectionRange(selStart, selEnd);
            else if ('value' in el && el.tagName !== 'SELECT') { const v = el.value; el.value = ''; el.value = v; } // caret to end
          } catch (e) {}
        }
      }
      window.scrollTo(0, scrollY);
    }

    function scheduleSharedSync() {
      if (!supabaseClient) return;
      if (sharedSyncTimer) clearTimeout(sharedSyncTimer);
      sharedSyncTimer = setTimeout(syncSharedCatalog, 300);
    }

    async function syncSharedCatalog() {
      if (!supabaseClient || !isStaffSession()) return;
      if (sharedSyncRunning) { sharedSyncAgain = true; return; }
      sharedSyncRunning = true;
      try {
        const { data: sessData } = await supabaseClient.auth.getSession();
        if (!sessData || !sessData.session) return;
        for (const col of SHARED_COLLECTIONS) {
          const snap = sharedSnapshot[col.key];
          if (!snap) continue;
          if (!col.writerRoles.includes(state.activeRole)) continue;
          const list = Array.isArray(state[col.key]) ? state[col.key] : [];
          const base = Date.now();
          list.forEach((item, idx) => {
            if (!item.createdAt) item.createdAt = col.newestFirst ? base - idx * 1000 : base - (list.length - idx) * 1000;
          });
          const upserts = list.filter((item) => snap[item.id] !== JSON.stringify(item));
          const removedIds = Object.keys(snap).filter((id) => !list.some((item) => item.id === id));
          if (upserts.length) {
            const rows = upserts.map((item) => ({ id: item.id, data: item, sort_key: Math.round(Number(item.createdAt) || 0) }));
            const { error } = await supabaseClient.from(col.key).upsert(rows, { onConflict: 'id' });
            if (error) {
              showToast(`Could not publish ${col.key} online: ${error.message}`, 'error');
              continue;
            }
            upserts.forEach((item) => { snap[item.id] = JSON.stringify(item); });
          }
          if (removedIds.length) {
            const { error } = await supabaseClient.from(col.key).delete().in('id', removedIds);
            if (error) {
              showToast(`Could not delete ${col.key} online: ${error.message}`, 'error');
              continue;
            }
            removedIds.forEach((id) => { delete snap[id]; });
          }
        }
      } catch (err) {
        console.error('Online sync failed:', err);
      } finally {
        sharedSyncRunning = false;
        if (sharedSyncAgain) { sharedSyncAgain = false; scheduleSharedSync(); }
      }
    }

    const ROLE_PRIORITY = ['owner', 'admin', 'stock_manager', 'order_manager'];

    // Staff roles live in the online database so they work on every device
    async function refreshStaffRoleFromDb() {
      if (!supabaseClient) return;
      try {
        const { data: sessData } = await supabaseClient.auth.getSession();
        const session = sessData && sessData.session;
        if (!session || !session.user) return;
        const email = normalizeEmail(session.user.email);
        const { data, error } = await supabaseClient.from('store_staff').select('role').eq('email', email);
        if (error) {
          console.error('Could not load staff role:', error.message);
          return;
        }
        const roles = (data || []).map((r) => r.role);
        if (!Array.isArray(state.users)) state.users = [];
        let u = state.users.find((x) => normalizeEmail(x.email) === email);
        if (!u) {
          u = { id: 'u-' + session.user.id, email, fullName: email.split('@')[0], roles: [], password: '' };
          state.users.push(u);
        }
        u.roles = roles;
        if (state.currentUser && normalizeEmail(state.currentUser.email) === email) {
          state.activeRole = ROLE_PRIORITY.find((r) => roles.includes(r)) || 'customer';
          if (state.activeRole === 'customer' && state.activeRoute === 'admin') state.activeRoute = 'home';
        }
        persistLocalCache();
        renderKeepingInput();
      } catch (err) {
        console.error('Could not load staff role:', err);
      }
      await loadSharedCatalog();
    }

    async function initSharedStore() {
      if (!supabaseClient) return;
      try {
        const { data: sessData } = await supabaseClient.auth.getSession();
        const session = sessData && sessData.session;
        if (!session && state.currentUser) {
          // A login only counts when the online login service confirms it
          state.currentUser = null;
          state.activeRole = 'customer';
          if (state.activeRoute === 'admin') state.activeRoute = 'home';
          persistLocalCache();
          renderKeepingInput();
        }
        if (session) await refreshStaffRoleFromDb();
        else await loadSharedCatalog();
      } catch (err) {
        console.error('Store init failed:', err);
        loadSharedCatalog();
      }

    initSupabaseIfConfigured();

    // Show non-blocking notification toast
    function showToast(message, type = 'success') {
      state.toast = { message, type };
      render();
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        state.toast = null;

    // Format numeric amounts into Bangladeshi Taka (BDT)
    function formatBDT(amount) {
      const num = Number(amount || 0);
      const formatted = Number.isInteger(num) ? num.toLocaleString('en-US') : num.toFixed(2);
      return `Tk ${formatted}`;
    }

    // Compute current Robux availability status
    function getRobuxStockStatus() {
      const stock = Number(state.robux.robuxStock || 0);
      const lowThreshold = Number(state.robux.lowStockThreshold || 0);
      if (state.robux.forceOutOfStock || stock <= 0) {
        return { available: false, label: 'Out of stock', tone: 'rose' };
      }
      if (stock <= lowThreshold) {
        return { available: true, label: 'Low stock', tone: 'amber' };
      }
      return { available: true, label: 'In stock', tone: 'emerald' };
    }

    // Format countdown string until configured restock timestamp
    function getRestockCountdownText() {
      if (!state.robux.restockAt) return '';
      const target = new Date(state.robux.restockAt).getTime();
      if (!Number.isFinite(target)) return '';
      const diffMs = target - (state.nowTick || Date.now());
      if (diffMs <= 0) return 'Restocking Soon';
      const totalSec = Math.floor(diffMs / 1000);
      const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSec % 60).padStart(2, '0');
      return `${hrs}h : ${mins}m : ${secs}s`;
    }

    // ===== Marketplace product status: active | upcoming | out_of_stock | inactive =====
    const PRODUCT_STATUSES = [
      { id: 'active', label: 'Active (On Sale)' },
      { id: 'upcoming', label: 'Upcoming (Coming Soon)' },
      { id: 'out_of_stock', label: 'Out of Stock' },
      { id: 'inactive', label: 'Inactive (Hidden)' },
    ];

    function getProductStatus(p) {
      if (!p) return 'inactive';
      // Literal list (not PRODUCT_STATUSES) because this runs inside loadState before that const exists
      if (['active', 'upcoming', 'out_of_stock', 'inactive'].includes(p.status)) return p.status;
      return p.isActive === false ? 'inactive' : 'active';
    }

    // Inactive products are hidden from every customer page
    function isProductVisible(p) {
      return getProductStatus(p) !== 'inactive';
    }

    // Only active products with stock can be added to cart / bought
    function canBuyProduct(p) {
      return getProductStatus(p) === 'active' && Number(p.stockQuantity) > 0;
    }

    function getProductBadgeLabel(p, showQty = true) {
      const status = getProductStatus(p);
      if (status === 'inactive') return 'Unavailable';
      if (status === 'upcoming') return '⏳ Upcoming';
      if (status === 'out_of_stock' || Number(p.stockQuantity) <= 0) return 'Out of stock';
      return showQty ? `In Stock (${p.stockQuantity})` : 'In Stock';
    }

    function getProductBadgeClass(p) {
      const status = getProductStatus(p);
      if (status === 'inactive') return 'bg-slate-100 text-slate-600 border border-slate-200/80';
      if (status === 'upcoming') return 'bg-amber-50 text-amber-700 border border-amber-200/80';
      if (status === 'out_of_stock' || Number(p.stockQuantity) <= 0) return 'bg-rose-50 text-rose-700 border border-rose-200/80';
      return 'bg-emerald-50 text-emerald-700 border border-emerald-200/80';
    }

    function getProductBuyLabel(p, defaultLabel) {
      const status = getProductStatus(p);
      if (status === 'upcoming') return 'Coming Soon';
      if (status === 'inactive') return 'Unavailable';
      if (!canBuyProduct(p)) return 'Out of Stock';
      return defaultLabel;
    }

    function getProductUnavailableMessage(p) {
      const status = getProductStatus(p);
      if (!p || status === 'inactive') return 'This product is not available right now.';
      if (status === 'upcoming') return 'This product is coming soon. It is not on sale yet.';
      return 'This product is out of stock.';
    }

    function getCartCount() {
      return state.cart.reduce((sum, item) => sum + (item.itemType === 'robux' ? 1 : Number(item.quantity || 1)), 0);
    }

    function getCartTotalBDT() {
      if (!Array.isArray(state.cart)) state.cart = [];
      return state.cart.reduce((sum, item) => sum + Math.round(Number(item.unitPriceBdt || 0) * Number(item.quantity || 1)), 0);
    }

    // ===== Product discounts & coupons =====
    function getProductDiscountPercent(p) {
      const d = Math.round(Number(p && p.discountPercent ? p.discountPercent : 0));
      if (!isFinite(d) || d <= 0) return 0;
      return Math.min(95, d);
    }

    function getProductFinalPrice(p) {
      if (!p) return 0;
      const d = getProductDiscountPercent(p);
      return Math.round(Number(p.priceBdt || 0) * (100 - d) / 100);
    }

    // Final price + crossed-out original + "-X%" pill when the product is discounted
    function renderProductPriceHtml(p) {
      const d = getProductDiscountPercent(p);
      if (!d) return formatBDT(p.priceBdt);
      return `${formatBDT(getProductFinalPrice(p))}<span class="ml-1.5 text-[11px] font-semibold text-slate-400 line-through align-middle">${formatBDT(p.priceBdt)}</span><span class="ml-1 px-1.5 py-0.5 rounded-md bg-rose-50 text-rose-600 text-[10px] font-bold align-middle">-${d}%</span>`;
    }

    // Keep cart product prices in sync with the owner's latest discounts
    function syncCartPrices() {
      if (!Array.isArray(state.cart)) state.cart = [];
      state.cart.forEach((item) => {
        if (item.itemType !== 'product' || !item.productId) return;
        const prod = state.products.find((p) => p.id === item.productId);
        if (prod) item.unitPriceBdt = getProductFinalPrice(prod);
      });
    }

    function normalizeCouponCode(val) {
      return String(val || '').trim().toUpperCase().replace(/\s+/g, '');
    }

    function isValidCouponCode(code) {
      return /^[A-Z0-9_-]{3,24}$/.test(code);
    }

    function findCouponByCode(code) {
      const c = normalizeCouponCode(code);
      if (!c) return null;
      return (state.coupons || []).find((cp) => normalizeCouponCode(cp.code) === c) || null;
    }

    function isCouponUsable(cp) {
      if (!cp || !cp.isActive) return false;
      const maxUses = Number(cp.maxUses || 0);
      if (maxUses > 0 && Number(cp.usedCount || 0) >= maxUses) return false;
      return true;
    }

    function getCouponDiscountBdt(subtotal, cp) {
      if (!cp || subtotal <= 0) return 0;
      const value = Number(cp.value || 0);
      if (cp.type === 'fixed') return Math.max(0, Math.min(Math.round(value), subtotal));
      return Math.max(0, Math.min(subtotal, Math.round(subtotal * Math.min(100, value) / 100)));
    }

    function getAppliedCoupon() {
      if (!state.appliedCouponCode) return null;
      const cp = findCouponByCode(state.appliedCouponCode);
      return isCouponUsable(cp) ? cp : null;
    }

    function describeCoupon(cp) {
      return cp.type === 'fixed' ? `${formatBDT(cp.value)} off` : `${Number(cp.value)}% off`;
    }

    function canManageDiscounts() {
      return isStaffSession() && state.activeRole === 'owner';
    }

    function addToCart(newItem) {
      if (!Array.isArray(state.cart)) state.cart = [];
      const existing = state.cart.find((i) => i.key === newItem.key);
      if (existing && newItem.itemType !== 'robux') {
        existing.quantity = Number(existing.quantity) + Number(newItem.quantity || 1);
      } else {
        state.cart.push(newItem);
      }
      saveState();
      showToast(`${newItem.title} added to cart!`, 'success');
      render();
    }

    function removeFromCart(key) {
      state.cart = state.cart.filter((i) => i.key !== key);
      saveState();
      render();
    }

    // Role-based access control helpers (requires a logged-in staff/admin/owner session)
    function isStaffSession() {
      if (!state.currentUser || !state.currentUser.email) return false;
      return ['owner', 'admin', 'stock_manager', 'order_manager'].includes(state.activeRole);
    }

    function canSeeStaffAdminControls() {
      return isStaffSession();
    }

    // These admin sections are visible to the Owner only (never admin / staff)
    const OWNER_ONLY_ADMIN_TABS = ['discounts', 'support', 'roles', 'categories', 'audit'];

    function canAccessAdminTab(tab) {
      if (!isStaffSession()) return false;
      const role = state.activeRole;
      if (OWNER_ONLY_ADMIN_TABS.includes(tab)) return role === 'owner';
      if (role === 'owner' || role === 'admin') return true;
      if (role === 'stock_manager') return tab === 'stock' || tab === 'marketplace';
      if (role === 'order_manager') return tab === 'orders';
      return false;
    }

    function getAllowedAdminTabsForCurrentRole() {
      if (!isStaffSession()) return [];
      const allTabs = [
        { id: 'dashboard', label: '📊 Dashboard' },
        { id: 'orders', label: '📦 Orders' },
        { id: 'marketplace', label: '🛍️ Marketplace' },
        { id: 'categories', label: '🗂️ Categories' },
        { id: 'stock', label: '📦 Stock & Restock' },
        { id: 'payments', label: '💳 Payment Methods' },
        { id: 'robux', label: '💎 Robux Rate' },
        { id: 'roles', label: '🛡️ Users & Roles' },
        { id: 'support', label: '💬 Support Settings' },
        { id: 'discounts', label: '🏷️ Discounts & Coupons' },
        { id: 'audit', label: '🕵️ Audit Log' },
      ];
      return allTabs.filter((t) => canAccessAdminTab(t.id));
    }

    function canManagePaymentNumbers() {
      return isStaffSession() && state.activeRole === 'owner';
    }

    function canManageCategories() {
      return isStaffSession() && state.activeRole === 'owner';
    }

    function canViewUsersAndRoles() {
      return isStaffSession() && state.activeRole === 'owner';
    }

    function canAssignRoles() {
      return isStaffSession() && state.activeRole === 'owner';
    }

    function isCurrentUserAuthorizedOwner() {
      const authorizedList = getAuthorizedOwnerEmails();
      if (!state.currentUser || !state.currentUser.email) {
        return isStaffSession() && state.activeRole === 'owner';
      }
      return authorizedList.includes(normalizeEmail(state.currentUser.email));
    }

    function canReceiveOwnerRole(targetEmail) {
      if (!state.exclusiveOwnerOnlyMe) return true;
      const authorizedList = getAuthorizedOwnerEmails();
      return authorizedList.includes(normalizeEmail(targetEmail));
    }

    function canSeeStaffEmails() {

    function displayUserEmail(email, isStaffAccount = false) {
      if (!email) return '';
      if (!isStaffAccount || canSeeStaffEmails()) {
        return escapeHtml(email);
      }
      const parts = String(email).split('@');
      const local = parts[0] || '';
      const domain = parts[1] || 'gmail.com';
      const prefix = local.slice(0, 2);
      return `${escapeHtml(prefix)}••••@${escapeHtml(domain)} <span class="ml-1 text-[10px] font-semibold text-amber-700">(Hidden • Owner Only)</span>`;
    }

    function getAvailableRolesToAssign() {
      if (!isStaffSession()) return [];
      if (state.activeRole === 'owner') {
        const canGiveOwner = !state.exclusiveOwnerOnlyMe || isCurrentUserAuthorizedOwner();
        return canGiveOwner
          ? ['owner', 'admin', 'stock_manager', 'order_manager']
          : ['admin', 'stock_manager', 'order_manager'];
      }
      if (state.activeRole === 'admin') {
        return ['admin', 'stock_manager', 'order_manager'];
      }
      return [];
    }

    function isValidGmailAddress(email) {
      const clean = normalizeEmail(email);
      const match = clean.match(/^([a-z0-9](?:[a-z0-9._+-]{0,62}[a-z0-9])?)@gmail\.com$/);
      if (!match) return false;
      const localPart = match[1];
      if (localPart.includes('..')) return false;
      if (localPart.length < 3 || localPart.length > 30) return false;
      const compact = localPart.replace(/[^a-z0-9]/g, '');
      const vowels = (compact.match(/[aeiou]/g) || []).length;
      const digits = (compact.match(/[0-9]/g) || []).length;
      if (compact.length >= 10 && vowels === 0 && digits === 0) return false;
      if (/(.)\1{4,}/.test(compact)) return false;
      return true;
    }

    function isApprovedGmailForSignup(email) {
      const clean = normalizeEmail(email);
      if (!state.requireApprovedGmailForSignup) return true;
      const allowlist = (state.approvedGmails || []).map((e) => normalizeEmail(e));
      return allowlist.includes(clean);
    }

    function getSignupGmailStatus(email, ignoreLocalAccounts = !!supabaseClient) {
      const clean = normalizeEmail(email);
      if (!clean) {
        return { ok: false, tone: 'neutral', message: 'Enter a Gmail address to check availability.' };
      }
      if (!isValidGmailAddress(clean)) {
        return {
          ok: false,
          tone: 'error',
          message: `✗ "${clean}" is not a valid Gmail address (must be a real name@gmail.com format without extra text).`,
        };
      }
      const alreadyCreated = (state.users || []).some((u) => normalizeEmail(u.email) === clean);
      if (alreadyCreated && !ignoreLocalAccounts) {
        return {
          ok: false,
          tone: 'error',
          message: `✗ "${clean}" already has an account. Please log in instead.`,
        };
      }
      if (state.requireApprovedGmailForSignup && !isApprovedGmailForSignup(clean)) {
        return {
          ok: false,
          tone: 'error',
          message: `✗ "${clean}" does not exist in the approved Gmail list — account creation is blocked.`,
        };
      }
      return {
        ok: true,
        tone: 'success',
        message: `✓ "${clean}" is available to create a new account.`,
      };
    }

    function getLoginGmailStatus(email) {
      const clean = normalizeEmail(email);
      if (!clean) {
        return { ok: false, tone: 'neutral', message: 'Enter your registered Gmail address to log in.' };
      }
      if (!isValidGmailAddress(clean) && !clean.includes('@')) {
        return { ok: false, tone: 'error', message: `✗ "${clean}" is not a valid email address.` };
      }
      const createdAccount = (state.users || []).some((u) => normalizeEmail(u.email) === clean);
      if (!createdAccount && !supabaseClient) {
        return {
          ok: false,
          tone: 'error',
          message: `✗ Account for "${clean}" has not been created yet — login is blocked until you sign up.`,
        };
      }
      return {
        ok: true,
        tone: 'success',
        message: `✓ Account found for "${clean}". Enter your password to log in.`,
      };
    }

    function refreshLiveAuthStatus() {
      const emailInput = document.getElementById('authEmail');
      const statusBox = document.getElementById('authGmailStatusBox');
      if (!emailInput || !statusBox) return;
      const mode = state.authModal || 'login';
      const info = mode === 'signup' ? getSignupGmailStatus(emailInput.value) : getLoginGmailStatus(emailInput.value);
      const cls =
        info.tone === 'success'
          ? 'bg-emerald-50 border-emerald-200 text-emerald-800'
          : info.tone === 'error'
          ? 'bg-rose-50 border-rose-200 text-rose-800'
          : 'bg-slate-50 border-slate-200 text-slate-600';
      statusBox.className = `p-3 rounded-xl border text-xs font-semibold ${cls}`;
      statusBox.textContent = info.message;
      const clean = normalizeEmail(emailInput.value);
      const hasAccount = clean && (state.users || []).some((u) => normalizeEmail(u.email) === clean);
      const switchTo = mode === 'login' && clean && clean.includes('@') && !hasAccount ? 'signup' : mode === 'signup' && hasAccount ? 'login' : null;
      if (switchTo) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'block mt-2 px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold';
        btn.textContent = switchTo === 'signup' ? 'Go to Sign Up →' : 'Go to Login →';
        btn.onclick = () => openAuthModal(switchTo, emailInput.value);
        statusBox.appendChild(btn);
      }
    }

    // Navigation helper
    function navigate(route, params = {}) {
      if (route === 'admin' && !isStaffSession()) {
        state.activeRoute = 'home';
        state.quickMenuOpen = false;
        showToast('Only logged-in staff, admin, or owner accounts can access Admin.', 'error');
        openAuthModal('login');
        return;
      }

      state.activeRoute = route;
      state.quickMenuOpen = false;
      if (params.category) state.selectedCategory = params.category;
      if (params.productId) state.selectedProductId = params.productId;
      if (route === 'admin' && !canAccessAdminTab(state.activeAdminTab)) {
        const allowed = getAllowedAdminTabsForCurrentRole();
        if (allowed.length) state.activeAdminTab = allowed[0].id;
      }
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Top navigation bar with search, cart counter, auth, and three-dots quick menu
    function renderNavbar() {
      try {
        const isPcMode = state.viewMode === 'pc';
        const showAdminNav = canSeeStaffAdminControls();

    };
    CATEGORY_LOGOS['Robux'] = 'data:image/svg+xml,%3Csvg%20fill=%22%23000000%22%20role=%22img%22%20viewBox=%220%200%2024%2024%22%20xmlns=%22http://www.w3.org/2000/svg%22%3E%3Ctitle%3ERoblox%3C/title%3E%3Cpath%20d=%22M18.926%2023.998%200%2018.892%205.075.002%2024%205.108ZM15.348%2010.09l-5.282-1.453-1.414%205.273%205.282%201.453z%22/%3E%3C/svg%3E';
    // Use the real brand logo unless the owner uploaded their own picture
    function getCategoryLogo(cat) {
      const url = cat && typeof cat.logoUrl === 'string' ? cat.logoUrl : '';
      const isPlaceholder = !url || url.startsWith('data:image/svg+xml;utf8,') || url.includes('placehold.co');
      const real = cat && CATEGORY_LOGOS[cat.name];
      if (isPlaceholder && real) return real;
      return url || ITEM_LOGOS.nitroBasic;
    }
    function isBrandLogo(src) {
      return Object.values(CATEGORY_LOGOS).includes(src);
    }
    function bvCatLogo(name, active) {
      const src = CATEGORY_LOGOS[name];
      if (!src) return '';
      return `<img src="${src}" alt="" style="width:14px;height:14px;object-fit:contain;flex:none;${active ? 'filter:brightness(0) invert(1);' : ''}" onerror="this.style.display='none'">`;
    }

    // Marketplace catalog view
    function renderMarketplacePage() {
      const dynamicNames = (state.categories || []).map((c) => c.name);
      const categories = ['All', ...dynamicNames];
      const q = state.searchQuery.trim().toLowerCase();
      const filtered = state.products.filter((p) => {
        if (!isProductVisible(p)) return false;
        const matchesCat = state.selectedCategory === 'All' || p.category === state.selectedCategory;
        const matchesQuery =
          !q ||
          p.title.toLowerCase().includes(q) ||
          p.description.toLowerCase().includes(q) ||
          p.category.toLowerCase().includes(q);
        return matchesCat && matchesQuery;
      });

      const activeCatObj = (state.categories || []).find((c) => c.name === state.selectedCategory);

      return `
        <main class="max-w-[1280px] w-full mx-auto px-4 sm:px-6 py-8 space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="font-display font-extrabold text-2xl sm:text-3xl text-slate-950">Digital Marketplace</h1>
              <p class="text-sm text-slate-500 mt-1">
                ${activeCatObj && activeCatObj.description ? escapeHtml(activeCatObj.description) : 'Discord Items, gift cards, game accounts, and in-game items with fast manual verification.'}
              </p>
            </div>
            <div class="flex flex-wrap gap-2">
              ${categories.map((cat) => `
                <button
                  type="button"
                  onclick="navigate('marketplace', { category: '${cat.replace(/'/g, "\\'")}' })"
                  class="px-3.5 py-2 rounded-full text-xs font-semibold flex items-center gap-1.5 transition ${
                    state.selectedCategory === cat
                      ? 'bg-brand-600 text-white'
                      : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'
                  }"
                >
                  ${bvCatLogo(cat, state.selectedCategory === cat)}
                  ${escapeHtml(cat)}
                </button>
              `).join('')}
            </div>
          </div>

          ${filtered.length === 0 ? `
            <div class="bg-white rounded-[20px] border border-slate-200/80 p-10 text-center soft-shadow space-y-3">
              <div class="text-4xl">🔍</div>
              <h2 class="font-display font-extrabold text-lg text-slate-950">No products found${q ? ` for “${escapeHtml(state.searchQuery.trim())}”` : ''}</h2>
              <p class="text-sm text-slate-500">Try a different word, or pick a category above.</p>
              <div class="flex flex-wrap justify-center gap-2 pt-1">
                <button type="button" onclick="handleSearchInput('')" class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold">Clear search</button>
                ${/robux|roblox/.test(q) ? `<button type="button" onclick="handleSearchInput('');navigate('robux')" class="px-4 py-2 rounded-xl border border-brand-600 text-brand-600 hover:bg-brand-50 text-xs font-semibold">Go to Robux Top-Up →</button>` : ''}
              </div>
            </div>
          ` : ''}
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            ${filtered.map((prod) => {
              const inStock = canBuyProduct(prod);
              return `
                <article class="bg-white rounded-[20px] border border-slate-200/80 p-4 flex flex-col justify-between soft-shadow">
                  <div>
                    <button
                      type="button"
                      onclick="navigate('product', { productId: '${prod.id}' })"
                      class="w-full h-36 rounded-xl overflow-hidden bg-slate-900 relative mb-3 block"
                    >
                      <img
                        src="${escapeHtml(prod.imageUrl || prod.logoUrl || FALLBACK_IMG)}"
                        onerror="this.onerror=null;this.src='${FALLBACK_IMG}';"
                        alt="${escapeHtml(prod.title)}"
                        class="w-full h-full object-cover"
                      />
                      <img
                        src="${escapeHtml(prod.logoUrl || FALLBACK_IMG)}"
                        onerror="this.onerror=null;this.src='${FALLBACK_IMG}';"
                        alt="${escapeHtml(prod.title)} logo"
                        class="w-8 h-8 rounded-lg object-cover border-2 border-white shadow absolute bottom-2.5 left-2.5 bg-white"
                      />
                    </button>
                    <div class="flex items-center justify-between text-[11px] font-semibold text-slate-500 mb-1">
                      <span>${escapeHtml(prod.category)}</span>
                      <span>★ ${Number(prod.ratingCount || 0).toLocaleString('en-US')} ratings</span>
                    </div>
                    <button type="button" onclick="navigate('product', { productId: '${prod.id}' })" class="text-left">
                      <h3 class="font-display font-bold text-base text-slate-950 line-clamp-1">${escapeHtml(prod.title)}</h3>
                    </button>
                    <p class="text-xs text-slate-500 line-clamp-2 mt-1">${escapeHtml(prod.description)}</p>
                  </div>

                  <div class="pt-4 mt-4 border-t border-slate-100">
                    <div class="flex items-center justify-between mb-3">
                      <span class="font-display font-extrabold text-lg text-slate-950">${renderProductPriceHtml(prod)}</span>
                      <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${
                        getProductBadgeClass(prod)
                      }">
                        ${getProductBadgeLabel(prod)}
                      </span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onclick="navigate('product', { productId: '${prod.id}' })"
                        class="py-2 px-3 rounded-xl border border-slate-200 hover:bg-slate-50 text-xs font-semibold text-slate-800"
                      >
                        Details
                      </button>
                      <button
                        type="button"
                        onclick="buyNowProduct('${prod.id}')"
                        ${!inStock ? 'disabled' : ''}
                        class="py-2 px-3 rounded-xl text-xs font-semibold ${
                          inStock ? 'bg-brand-600 hover:bg-brand-700 text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                        }"
                      >
                        ${getProductBuyLabel(prod, 'Buy Now')}
                      </button>
                    </div>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        </main>
      `;
    }

    // Individual product detail view
    function renderProductDetailPage() {
      const prod = state.products.find((p) => p.id === state.selectedProductId) || state.products.find((p) => isProductVisible(p));
      if (!prod || (!isProductVisible(prod) && !isStaffSession())) {
        return `
          <main class="max-w-[1000px] w-full mx-auto px-4 sm:px-6 py-8">

              <p class="text-sm text-slate-500">It may have been removed or hidden by the store.</p>
              <button type="button" onclick="navigate('marketplace')" class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold">← Back to Marketplace</button>

                  class="w-full h-full object-cover"
                />
                <img
                  src="${escapeHtml(prod.logoUrl || FALLBACK_IMG)}"
                  onerror="this.onerror=null;this.src='${FALLBACK_IMG}';"

                  class="w-11 h-11 rounded-xl object-cover border-2 border-white shadow-lg absolute bottom-3 left-3 bg-white"
                />
              </div>
            </div>
            <div class="md:col-span-7 flex flex-col justify-between space-y-5">

                  <span class="px-2.5 py-1 rounded-full ${getProductBadgeClass(prod)}">
                    ${getProductBadgeLabel(prod)}
                  </span>
                  <span class="text-slate-500">★ ${Number(prod.ratingCount || 0).toLocaleString('en-US')} Rate Count</span>
                </div>
                <h1 class="font-display font-extrabold text-2xl text-slate-950">${escapeHtml(prod.title)}</h1>
                <p class="text-sm text-slate-600 leading-relaxed">${escapeHtml(prod.description)}</p>
                <div class="font-display font-extrabold text-3xl text-brand-600 pt-1">${renderProductPriceHtml(prod)}</div>
              </div>
              <div class="flex flex-wrap gap-3">
                <button
                  type="button"
                  onclick="addProductToCart('${prod.id}')"
                  ${!inStock ? 'disabled' : ''}
                  class="px-5 py-3 rounded-xl border border-brand-600 text-brand-600 hover:bg-brand-50 font-semibold text-sm disabled:opacity-40"
                >
                  🛒 Add to Cart
                </button>
                <button
                  type="button"

    // Manual mobile banking checkout view (bKash, Nagad, Upay, Rocket)
    function renderCheckoutPage() {
      const enabledMethods = state.paymentMethods.filter((m) => m.isEnabled);
      syncCartPrices();
      const subtotalBdt = getCartTotalBDT();
      const appliedCoupon = getAppliedCoupon();
      const couponDiscountBdt = getCouponDiscountBdt(subtotalBdt, appliedCoupon);
      const totalBdt = subtotalBdt - couponDiscountBdt;
      const requiresRoblox = state.cart.some((i) => i.itemType === 'robux' || i.requiresRobloxUsername);
      const requiresDiscord = state.cart.some((i) => i.requiresDiscordTag || i.category === 'Discord Items');
      const selectedMethodId = window.__selectedPaymentMethodId || (enabledMethods[0] && enabledMethods[0].id) || '';
      const activeMethod = enabledMethods.find((m) => m.id === selectedMethodId) || enabledMethods[0] || null;

      return `
        <main class="max-w-[1140px] w-full mx-auto px-4 sm:px-6 py-8 space-y-6">
          <h1 class="font-display font-extrabold text-2xl sm:text-3xl text-slate-950">Checkout & Manual Payment</h1>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-5 bg-white rounded-[20px] border border-slate-200/80 p-5 soft-shadow space-y-4 h-fit">
              <h2 class="font-display font-bold text-base text-slate-950">Order Summary</h2>
              ${
                state.cart.length === 0
                  ? `<div class="py-8 text-center text-sm text-slate-500">
                      Your cart is empty. <button type="button" onclick="navigate('marketplace')" class="text-brand-600 font-semibold underline">Browse Marketplace</button>
                     </div>`
                  : `
                    <div class="divide-y divide-slate-100">
                      ${state.cart.map((item) => `
                        <div class="py-3 flex items-center justify-between gap-3">
                          <div>
                            <div class="font-semibold text-sm text-slate-900">${escapeHtml(item.title)}</div>
                            <div class="text-xs text-slate-500">
                              ${item.itemType === 'robux' ? `${Number(item.quantity).toLocaleString('en-US')} Robux` : `Qty: ${item.quantity}`} × ${formatBDT(item.unitPriceBdt)}
                            </div>
                          </div>
                          <div class="flex items-center gap-3">
                            <span class="font-display font-bold text-sm text-slate-950">
                              ${formatBDT(Number(item.unitPriceBdt) * Number(item.quantity))}
                            </span>
                            <button type="button" onclick="removeFromCart('${item.key}')" class="text-xs text-rose-600 hover:underline">Remove</button>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                    <div class="pt-3 border-t border-slate-200 space-y-2">
                      <label class="block text-xs font-bold text-slate-700">🏷️ Have a coupon?</label>
                      ${
                        appliedCoupon
                          ? `<div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-xs">
                              <span class="font-semibold text-emerald-800">Coupon <span class="font-mono font-bold">${escapeHtml(appliedCoupon.code)}</span> applied (${escapeHtml(describeCoupon(appliedCoupon))})</span>
                              <button type="button" onclick="removeCheckoutCoupon()" class="text-rose-600 font-semibold hover:underline">Remove</button>
                            </div>`
                          : `<form onsubmit="applyCheckoutCoupon(event)" class="flex gap-2">
                              <input id="checkoutCouponInput" type="text" placeholder="Enter coupon code" class="flex-1 min-w-0 h-9 px-3 rounded-xl border border-slate-200 bg-[#F4F7FC] text-xs font-mono uppercase focus:bg-white focus:border-brand-600 focus:outline-none" />
                              <button type="submit" class="px-3.5 h-9 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold">Redeem</button>
                            </form>`
                      }
                    </div>
                    <div class="pt-3 border-t border-slate-200 space-y-1 text-sm">
                      <div class="flex items-center justify-between text-slate-600"><span>Subtotal</span><span class="font-semibold">${formatBDT(subtotalBdt)}</span></div>
                      ${couponDiscountBdt > 0 ? `<div class="flex items-center justify-between text-emerald-700"><span>Coupon discount</span><span class="font-semibold">−${formatBDT(couponDiscountBdt)}</span></div>` : ''}
                    </div>

                              <span class="inline-block px-2 py-0.5 rounded text-white text-[11px] font-bold mb-1" style="background:${m.badgeBg}">${escapeHtml(m.badgeText)}</span>

                                >
                                  Copy Number
                                </button>
                              </div>
                              <p class="text-xs text-slate-600">${escapeHtml(activeMethod.instructionNote || '')}</p>
                            </div>

                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label class="block text-xs font-bold text-slate-700 mb-1">
                            Transaction ID (TrxID) <span class="text-rose-600">*</span>

                            type="text"
                            required

                        </div>

                        <div>
                          <label class="block text-xs font-bold text-slate-700 mb-1">

                          </label>

                            id="checkoutLast4"
                            type="text"
                            required
                            maxlength="4"
                            pattern="[0-9]{4}"

                          required

          </div>

    // Order history view
    function renderOrdersPage() {
      const hasStaffAccess = isStaffSession();
      const currentEmail = normalizeEmail(state.currentUser && state.currentUser.email ? state.currentUser.email : '');
      const visibleOrders = hasStaffAccess
        ? state.orders
        : currentEmail
        ? state.orders.filter((o) => normalizeEmail(o.customerEmail) === currentEmail)
        : [];

      return `
        <main class="max-w-[1140px] w-full mx-auto px-4 sm:px-6 py-8 space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-3">

              <p class="text-sm text-slate-500 mt-1">

                  hasStaffAccess
                    ? 'Viewing all store orders as staff: Pending → Processing → Completed / Rejected / Refunded.'
                    : 'Showing only your orders: Pending → Processing → Completed / Rejected / Refunded.'
                }
              </p>
            </div>
            ${
              !state.currentUser
                ? `<button type="button" onclick="openAuthModal('login')" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-semibold">Login to View Your Orders</button>`
                : ''
            }

            !hasStaffAccess && !currentEmail

                  <button type="button" onclick="openAuthModal('login')" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold">
                    Login / Sign Up
                  </button>

              : visibleOrders.length === 0
              ? `
                <div class="bg-white rounded-[20px] border border-slate-200/80 p-8 text-center soft-shadow space-y-2">
                  <div class="text-2xl">📦</div>
                  <h2 class="font-display font-bold text-lg text-slate-950">No Orders Found for Your Account</h2>
                  <p class="text-sm text-slate-500">Orders placed with <strong>${escapeHtml(state.currentUser.email)}</strong> will appear here.</p>
                </div>
              `
              : `
          <div class="bg-white rounded-[20px] border border-slate-200/80 overflow-x-auto soft-shadow">
            <table class="w-full text-left border-collapse min-w-[760px]">
              <thead>
                <tr class="border-b border-slate-100 text-[11px] font-bold uppercase tracking-wider text-slate-500 bg-[#F4F7FC]">

              <tbody class="divide-y divide-slate-100 text-sm">
                ${visibleOrders.map((o) => `
                  <tr>
                    <td class="py-3.5 px-4 font-mono font-bold text-xs text-slate-900">${escapeHtml(o.orderNumber)}</td>
                    <td class="py-3.5 px-4">
                      <div class="font-semibold text-slate-900">${escapeHtml(o.itemTitle)}</div>
                      ${o.whatsappNumber ? `<div class="text-xs text-emerald-700 font-semibold">WhatsApp: ${escapeHtml(o.whatsappNumber)}</div>` : ''}
                      ${o.robloxUsername ? `<div class="text-xs text-slate-500">Roblox: ${escapeHtml(o.robloxUsername)}</div>` : ''}
                      ${o.discordUsername ? `<div class="text-xs text-indigo-600">Discord: ${escapeHtml(o.discordUsername)}</div>` : ''}

                    <td class="py-3.5 px-4 font-display font-bold text-slate-950">${formatBDT(o.totalAmountBdt)}</td>
                    <td class="py-3.5 px-4 text-xs">
                      <div class="font-semibold text-slate-800">${escapeHtml(o.paymentMethodName)}</div>
                      <div class="font-mono text-slate-500">${escapeHtml(o.trxId)}</div>
                    </td>
                    <td class="py-3.5 px-4 font-mono text-xs">${escapeHtml(o.senderLast4)}</td>

                      <div class="space-y-2">

                          ${
                            (o.messages || []).length === 0
                              ? '<div class="text-xs text-slate-400">No messages on this order yet.</div>'

                                  <div class="p-2.5 rounded-xl border text-xs ${
                                    m.senderRole === 'customer'
                                      ? 'bg-white border-slate-200 text-slate-800'
                                      : 'bg-brand-50/70 border-brand-200 text-slate-900'
                                  }">
                                    <div class="flex items-center justify-between gap-2 mb-0.5">
                                      <span class="font-bold">${escapeHtml(m.senderName)} <span class="text-[10px] uppercase px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">${escapeHtml(m.senderRole)}</span></span>

                                    </div>
                                    <div>${escapeHtml(m.text)}</div>
                                  </div>
                                `).join('')
                          }
                        </div>
                        <form onsubmit="sendOrderMessage(event, '${o.id}', 'customer')" class="flex items-center gap-2 pt-1">
                          <input
                            id="customerOrderMsg_${o.id}"
                            type="text"
                            required
                            placeholder="Write a message about this order..."
                            class="flex-1 h-9 px-3 rounded-xl border border-slate-200 bg-white text-xs focus:outline-none focus:border-brand-600"
                          />
                          <button type="submit" class="h-9 px-3.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold shrink-0">
                            Send Message
                          </button>
                        </form>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
              `
          }
        </main>
      `;
    }

        return `
          <main class="max-w-[760px] w-full mx-auto px-4 sm:px-6 py-12">
            <div class="bg-white rounded-[22px] border border-rose-200 p-8 text-center soft-shadow space-y-3">

    // Admin sub-tab content renderer
    function renderAdminTabContent(tab) {
      const isPcMode = state.viewMode === 'pc';

      if (tab === 'dashboard') {
        const pendingCount = state.orders.filter((o) => o.status === 'Pending').length;
        const completedRevenue = state.orders
          .filter((o) => o.status === 'Completed')
          .reduce((acc, o) => acc + Number(o.totalAmountBdt), 0);
        const lowStockProducts = state.products.filter((p) => Number(p.stockQuantity) <= Number(p.lowStockThreshold || 5));
        const robuxLow = Number(state.robux.robuxStock) <= Number(state.robux.lowStockThreshold || 5000) || state.robux.forceOutOfStock;
        const lowStockTotal = lowStockProducts.length + (robuxLow ? 1 : 0);

        return `
          <div class="grid ${isPcMode ? 'grid-cols-4' : 'grid-cols-1 sm:grid-cols-2 xl:grid-cols-4'} gap-4">
            <div class="bg-white rounded-[18px] border border-slate-200/80 p-4 soft-shadow">
              <div class="text-xs font-semibold text-slate-500">Total Orders</div>
              <div class="font-display font-extrabold text-2xl text-slate-950 mt-1">${state.orders.length}</div>
            </div>
            <div class="bg-white rounded-[18px] border border-slate-200/80 p-4 soft-shadow">
              <div class="text-xs font-semibold text-slate-500">Pending Orders</div>
              <div class="font-display font-extrabold text-2xl text-amber-600 mt-1">${pendingCount}</div>
            </div>
            <div class="bg-white rounded-[18px] border border-slate-200/80 p-4 soft-shadow">
              <div class="text-xs font-semibold text-slate-500">Completed Revenue</div>
              <div class="font-display font-extrabold text-2xl text-brand-600 mt-1">${formatBDT(completedRevenue)}</div>
            </div>
            <div class="bg-white rounded-[18px] border border-slate-200/80 p-4 soft-shadow">
              <div class="text-xs font-semibold text-slate-500">Low / Out-of-Stock Alerts</div>
              <div class="font-display font-extrabold text-2xl text-rose-600 mt-1">${lowStockTotal}</div>
            </div>
          </div>
        `;
      }

      if (tab === 'orders') {
        const statusFilter = window.__adminOrderStatusFilter || 'All';
        const searchTerm = (window.__adminOrderSearch || '').trim().toLowerCase();
        const rows = state.orders.filter((o) => {
          const matchesStatus = statusFilter === 'All' || o.status === statusFilter;
          const matchesSearch =
            !searchTerm ||
            o.orderNumber.toLowerCase().includes(searchTerm) ||
            o.trxId.toLowerCase().includes(searchTerm) ||
            (o.robloxUsername && o.robloxUsername.toLowerCase().includes(searchTerm)) ||
            (o.discordUsername && o.discordUsername.toLowerCase().includes(searchTerm)) ||
            o.customerEmail.toLowerCase().includes(searchTerm);
          return matchesStatus && matchesSearch;

        return `
          <div class="bg-white rounded-[20px] border border-slate-200/80 p-5 soft-shadow space-y-4">

                <input
                  id="adminOrderSearchInput"
                  type="text"

                        ${o.robloxUsername ? `<div class="text-slate-600">Roblox: <strong>${escapeHtml(o.robloxUsername)}</strong></div>` : ''}
                        ${o.discordUsername ? `<div class="text-indigo-600">Discord: <strong>${escapeHtml(o.discordUsername)}</strong></div>` : ''}
                      </td>
                      <td class="py-3 px-3">
                        <div><strong>${escapeHtml(o.paymentMethodName)}</strong> • Last 4: <span class="font-mono">${escapeHtml(o.senderLast4)}</span></div>
                        <div class="font-mono text-slate-600">TrxID: ${escapeHtml(o.trxId)}</div>
                      </td>
                      <td class="py-3 px-3">${renderStatusBadge(o.status)}</td>
                      <td class="py-3 px-3">
                        <select
                          onchange="updateOrderStatus('${o.id}', this.value)"
                          class="h-8 px-2 rounded-lg border border-slate-200 bg-white text-xs font-semibold"
                        >
                          ${['Pending', 'Processing', 'Completed', 'Rejected', 'Refunded'].map((st) => `
                            <option value="${st}" ${o.status === st ? 'selected' : ''}>${st}</option>

                        </select>
                      </td>
                    </tr>
                    <tr>
                      <td colspan="5" class="px-3 py-3 bg-[#F8FAFF]">
                        <div class="space-y-2">
                          <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500">

                                    </div>

                      </td>

                  `).join('')}
                </tbody>
              </table>

                <input id="newProdRatingCount" type="number" min="0" value="100" class="w-full h-9 px-3 rounded-xl border border-slate-200 bg-[#F4F7FC] text-xs" />

                  }
                </div>
                <input
                  id="newProdLogo"
                  type="text"
                  value="${escapeHtml(uploadedLogoPreview)}"

                />
              </div>
              <div class="sm:col-span-2 lg:col-span-2">
                <label class="block text-xs font-semibold text-slate-700 mb-1">Description *</label>
                <input id="newProdDesc" type="text" required placeholder="Short digital product summary" class="w-full h-9 px-3 rounded-xl border border-slate-200 bg-[#F4F7FC] text-xs" />
              </div>
              <div class="flex items-end">
                <button type="submit" class="w-full h-9 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold">
                  + Save Product
                </button>
              </div>
            </form>

            <div class="pt-4 border-t border-slate-100 space-y-2.5">
              <h3 class="font-display font-bold text-sm text-slate-900">Existing Products</h3>
              ${state.products.map((p) => `
                <div class="flex flex-wrap items-center justify-between gap-3 p-3 rounded-xl bg-[#F4F7FC] border border-slate-200/70 text-xs">
                  <div class="flex items-center gap-3">
                    <img

                    <button type="button" onclick="deleteCoupon('${c.id}')" class="h-9 px-3 rounded-xl border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold">Remove</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (tab === 'audit') {
        if (!(isStaffSession() && state.activeRole === 'owner')) return '';
        const log = Array.isArray(state.auditLog) ? state.auditLog : [];
        const actorFilter = window.__auditActor || '';
        const sevFilter = window.__auditSeverity || '';
        const q = (window.__auditSearch || '').trim().toLowerCase();
        const actors = Array.from(new Set(log.map((l) => l.actorEmail))).filter(Boolean);
        const rows = log.filter((l) =>
          (!actorFilter || l.actorEmail === actorFilter) &&
          (!sevFilter || (sevFilter === 'risky' ? l.severity !== 'info' : l.severity === sevFilter)) &&
          (!q || `${l.action} ${l.details} ${l.actorEmail}`.toLowerCase().includes(q))
        );
        const dayAgo = Date.now() - 24 * 60 * 60 * 1000;
        const last24 = log.filter((l) => new Date(l.at).getTime() >= dayAgo);
        const risky24 = last24.filter((l) => l.severity !== 'info').length;
        const nonOwner24 = last24.filter((l) => l.actorRole !== 'owner');
        const countsByActor = {};
        nonOwner24.forEach((l) => { countsByActor[l.actorEmail] = (countsByActor[l.actorEmail] || 0) + 1; });
        const topActor = Object.entries(countsByActor).sort((a, b) => b[1] - a[1])[0];
        const sevBadge = (s) => s === 'danger'
          ? '<span class="px-2 py-0.5 rounded-full text-[10.5px] font-bold bg-rose-50 text-rose-700">🚨 High risk</span>'
          : s === 'warning'
            ? '<span class="px-2 py-0.5 rounded-full text-[10.5px] font-bold bg-amber-50 text-amber-700">⚠️ Sensitive</span>'
            : '<span class="px-2 py-0.5 rounded-full text-[10.5px] font-bold bg-slate-100 text-slate-600">Normal</span>';
        const selCls = 'h-9 px-3 rounded-xl border border-slate-200 bg-[#F4F7FC] text-xs font-semibold';
        return `

              <div class="font-display font-extrabold text-2xl text-slate-950 mt-1">${last24.length}</div>
            </div>
            <div class="bg-white rounded-[18px] border ${risky24 ? 'border-rose-200' : 'border-slate-200/80'} p-4 soft-shadow">
              <div class="text-xs font-semibold text-slate-500">Risky actions (24h)</div>
              <div class="font-display font-extrabold text-2xl ${risky24 ? 'text-rose-600' : 'text-slate-950'} mt-1">${risky24}</div>
            </div>
            <div class="bg-white rounded-[18px] border border-slate-200/80 p-4 soft-shadow">
              <div class="text-xs font-semibold text-slate-500">Most active staff (24h, not owner)</div>
              <div class="font-display font-bold text-sm text-slate-950 mt-2 truncate">${topActor ? `${escapeHtml(topActor[0])} • ${topActor[1]} actions` : '—'}</div>
            </div>
          </div>

          <div class="bg-white rounded-[20px] border border-slate-200/80 p-5 soft-shadow space-y-4">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <h2 class="font-display font-bold text-lg text-slate-950">Audit Log</h2>
                <p class="text-xs text-slate-500">Every change made by staff, admins and owners — who did it, when, and what changed. Entries can't be edited or deleted.</p>
              </div>
              <button type="button" onclick="exportAuditLogCsv()" class="h-9 px-3.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-xs font-semibold text-slate-800">⬇️ Download CSV</button>
            </div>
            <div class="flex flex-wrap gap-2">
              <select onchange="setAuditFilter('actor', this.value)" class="${selCls}" aria-label="Filter by staff member">
                <option value="">All staff</option>
                ${actors.map((a) => `<option value="${escapeHtml(a)}" ${a === actorFilter ? 'selected' : ''}>${escapeHtml(a)}</option>`).join('')}
              </select>
              <select onchange="setAuditFilter('severity', this.value)" class="${selCls}" aria-label="Filter by risk">
                <option value="" ${!sevFilter ? 'selected' : ''}>All actions</option>
                <option value="risky" ${sevFilter === 'risky' ? 'selected' : ''}>Risky only (sensitive + high risk)</option>
                <option value="danger" ${sevFilter === 'danger' ? 'selected' : ''}>High risk only</option>
              </select>
              <input type="search" value="${escapeHtml(window.__auditSearch || '')}" onchange="setAuditFilter('search', this.value)" placeholder="Search action, details, email… (press Enter)" class="flex-1 min-w-[200px] h-9 px-3 rounded-xl border border-slate-200 bg-[#F4F7FC] text-xs" />
            </div>
            <div class="text-[11px] text-slate-500">Showing ${Math.min(rows.length, 300)} of ${rows.length} matching entries (${log.length} total).</div>
            <div class="space-y-2">
              ${rows.length === 0 ? '<div class="py-6 text-center text-xs text-slate-500">No staff actions recorded yet.</div>' : ''}
              ${rows.slice(0, 300).map((l) => `
                <div class="p-3 rounded-xl border text-xs ${l.severity === 'danger' ? 'bg-rose-50 border-rose-200' : l.severity === 'warning' ? 'bg-amber-50 border-amber-200' : 'bg-[#F4F7FC] border-slate-200/70'}">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="font-bold text-slate-950">${escapeHtml(l.action)}</span>
                      ${sevBadge(l.severity)}
                    </div>
                    <span class="text-[11px] text-slate-500 font-mono">${escapeHtml(formatAuditTime(l.at))}</span>
                  </div>
                  <div class="mt-1 text-slate-700">${escapeHtml(l.details || '')}</div>
                  <div class="mt-1 text-[11px] text-slate-500">by <strong class="text-slate-800">${escapeHtml(l.actorEmail)}</strong> <span class="px-1.5 py-0.5 rounded bg-slate-900 text-white text-[10px] font-bold">${escapeHtml(l.actorRole)}</span></div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (tab === 'roles') {
        if (!canViewUsersAndRoles()) {
          return `
            <div class="bg-white rounded-[20px] border border-rose-200 p-6 text-center soft-shadow space-y-2">
              <div class="text-sm font-bold text-rose-700">🔒 Owner Only</div>
              <p class="text-xs text-slate-600">Only the <strong>Owner</strong> can view or manage Users & Roles.</p>
            </div>
          `;
        }
        const assignableRoles = getAvailableRolesToAssign();
        const authorizedOwnerEmailsText = getAuthorizedOwnerEmails().join(', ');
        const showEmails = canSeeStaffEmails();

        return `
          <div class="bg-white rounded-[20px] border border-slate-200/80 p-5 soft-shadow space-y-5">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <h2 class="font-display font-bold text-lg text-slate-950">Give Someone a Role (Users & Roles)</h2>
                <p class="text-xs text-slate-500">
                  ${
                    state.activeRole === 'owner'
                      ? 'As Owner, you can assign roles to team members. Admin & staff Gmails are hidden from everyone except you.'
                      : 'As Admin, you can assign Admin, Stock Manager, and Order Manager roles (Owner role is restricted).'
                  }
                </p>
              </div>

              <div class="p-3 rounded-2xl bg-[#F4F7FC] border border-slate-200/80 space-y-2 min-w-[290px]">
                <div class="flex items-center justify-between gap-2 text-xs">
                  <span class="font-bold text-slate-800">🔒 Authorized Owner Accounts</span>
                  <button
                    type="button"
                    onclick="toggleExclusiveOwnerLock()"
                    class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                      state.exclusiveOwnerOnlyMe
                        ? 'bg-slate-900 text-white'
                        : 'bg-white text-slate-700 border border-slate-300'
                    }"
                  >
                    ${state.exclusiveOwnerOnlyMe ? 'ON (Locked to Both)' : 'OFF'}
                  </button>
                </div>
                <div class="flex items-center gap-1.5">
                  <input
                    id="exclusiveOwnerEmailInput"
                    type="text"
                    value="${escapeHtml(authorizedOwnerEmailsText)}"
                    placeholder="owner1@gmail.com, owner2@gmail.com"
                    class="h-8 px-2.5 rounded-lg border border-slate-200 bg-white text-[11px] flex-1"
                  />
                  <button
                    type="button"
                    onclick="saveExclusiveOwnerEmail()"
                    class="h-8 px-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-[11px] font-semibold"
                  >
                    Save
                  </button>
                </div>
              </div>
            </div>

            <form onsubmit="assignRoleToUser(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
              <div class="sm:col-span-5">
                <label class="block text-xs font-semibold text-slate-700 mb-1">User Email</label>
                <input
                  id="roleTargetEmail"
                  type="email"
                  list="knownUsersList"
                  required
                  placeholder="user@example.com"
                  class="w-full h-10 px-3 rounded-xl border border-slate-200 bg-[#F4F7FC] text-xs"
                />
                <datalist id="knownUsersList">
                  ${
                    showEmails
                      ? state.users.map((u) => `<option value="${escapeHtml(u.email)}"></option>`).join('')
                      : ''
                  }
                </datalist>
              </div>
              <div class="sm:col-span-4">
                <label class="block text-xs font-semibold text-slate-700 mb-1">Role to Give</label>
                <select id="roleTargetSelect" class="w-full h-10 px-3 rounded-xl border border-slate-200 bg-[#F4F7FC] text-xs font-semibold">
                  ${assignableRoles.map((r) => `<option value="${r}">${r}</option>`).join('')}
                </select>
              </div>
              <div class="sm:col-span-3">
                <button type="submit" class="w-full h-10 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold">
                  Give Role
                </button>
              </div>
            </form>

            <div class="divide-y divide-slate-100 border border-slate-200/80 rounded-2xl overflow-hidden">
              ${state.users.map((u) => {
                const hasStaffRole = Array.isArray(u.roles) && u.roles.some((r) => ['owner', 'admin', 'stock_manager', 'order_manager'].includes(r));
                return `
                  <div class="p-3.5 bg-white flex flex-wrap items-center justify-between gap-3 text-xs">
                    <div>
                      <div class="font-bold text-slate-900">${escapeHtml(u.fullName || 'Member')}</div>
                      <div class="text-slate-500">${displayUserEmail(u.email, hasStaffRole)}</div>
                    </div>
                    <div class="flex flex-wrap items-center gap-1.5">
                      ${
                        !Array.isArray(u.roles) || u.roles.length === 0
                          ? '<span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 font-semibold">customer</span>'
                          : u.roles.map((r) => `
                              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-brand-50 text-brand-700 border border-brand-200 font-bold">
                                <span>${escapeHtml(r)}</span>
                                ${
                                  (r !== 'owner' || state.activeRole === 'owner')
                                    ? `<button type="button" onclick="revokeRoleFromUser('${u.id}', '${r}')" class="text-rose-600 hover:text-rose-800 font-extrabold" title="Revoke role">×</button>`
                                    : ''
                                }
                              </span>
                            `).join('')
                      }
                      ${
                        state.activeRole === 'owner' && (!Array.isArray(u.roles) || !u.roles.includes('owner'))
                          ? `<button type="button" onclick="removeUserEntry('${u.id}')" class="ml-1 px-2 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold">Remove</button>`
                          : ''
                      }
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      return '';
    }

    function renderStatusBadge(status) {
      const styles = {
        Pending: 'bg-amber-50 text-amber-800 border-amber-200',
        Processing: 'bg-sky-50 text-sky-700 border-sky-200',
        Completed: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        Rejected: 'bg-rose-50 text-rose-700 border-rose-200',
        Refunded: 'bg-slate-100 text-slate-700 border-slate-200',
      };
      return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold border ${styles[status] || styles.Pending}">${escapeHtml(status)}</span>`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

      state.cart = [

    function selectCheckoutMethod(methodId) {
