    function submitManualOrder(e) {
      e.preventDefault();
      if (state.cart.length === 0) {
        showToast('Your cart is empty.', 'error');
        return;
      }
      const unavailableItem = state.cart.find((item) => {
        if (item.itemType !== 'product' || !item.productId) return false;
        const prod = state.products.find((p) => p.id === item.productId);
        return !prod || !canBuyProduct(prod);
      });
      if (unavailableItem) {
        showToast(`"${unavailableItem.title}" is no longer available. Please remove it from your cart.`, 'error');
        return;
      }
      const enabledMethods = state.paymentMethods.filter((m) => m.isEnabled);
      const selectedMethodId = window.__selectedPaymentMethodId || (enabledMethods[0] && enabledMethods[0].id);
      const method = enabledMethods.find((m) => m.id === selectedMethodId);
      if (!method) {
        showToast('Please select an enabled payment method.', 'error');
        return;
      }

      const trxId = (document.getElementById('checkoutTrxId')?.value || '').trim().toUpperCase();
      const senderLast4 = (document.getElementById('checkoutLast4')?.value || '').trim();
      const whatsappNumber = (document.getElementById('checkoutWhatsapp')?.value || '').trim();
      const robloxUser = (document.getElementById('checkoutRobloxUser')?.value || '').trim();
      const discordUser = (document.getElementById('checkoutDiscordUser')?.value || '').trim();

      if (trxId.length < 4) {
        showToast('Enter a valid Transaction ID (TrxID).', 'error');
        return;
      }
      if (!/^[0-9]{4}$/.test(senderLast4)) {
        showToast('Sender last 4 digits must be exactly 4 numeric digits.', 'error');
        return;
      }
      const cleanWhatsappDigits = whatsappNumber.replace(/[^0-9]/g, '');
      if (cleanWhatsappDigits.length < 7) {
        showToast('Please enter a valid WhatsApp number to receive your order.', 'error');
        return;
      }
      const duplicateTrx = state.orders.some((o) => o.trxId.toUpperCase() === trxId && o.status !== 'Rejected');
      if (duplicateTrx) {
        showToast('Duplicate Transaction ID detected. Each order requires a unique TrxID.', 'error');
        return;
      }

      const customerEmail = state.currentUser ? state.currentUser.email : 'guest@bluevolt.bd';
      const nowStr = new Date().toISOString().slice(0, 16).replace('T', ' ');

      syncCartPrices();
      const subtotalBdt = getCartTotalBDT();
      if (state.appliedCouponCode && !getAppliedCoupon()) {
        state.appliedCouponCode = '';
        saveState();
        showToast('Your coupon is no longer valid and was removed. Please check the new total.', 'error');
        render();
        return;
      }
      const appliedCoupon = getAppliedCoupon();
      const couponDiscountTotal = getCouponDiscountBdt(subtotalBdt, appliedCoupon);
      let couponDiscountLeft = couponDiscountTotal;

      for (const [lineIdx, item] of state.cart.entries()) {
        const lineOriginal = Math.round(Number(item.unitPriceBdt) * Number(item.quantity));
        const isLastLine = lineIdx === state.cart.length - 1;
        const lineDiscount = couponDiscountTotal > 0
          ? (isLastLine ? couponDiscountLeft : Math.min(couponDiscountLeft, Math.round(lineOriginal * couponDiscountTotal / subtotalBdt)))
          : 0;
        couponDiscountLeft -= lineDiscount;
        const lineTotal = lineOriginal - lineDiscount;
        const orderNumber = 'BV-' + Math.random().toString(36).substring(2, 10).toUpperCase();
        state.orders.unshift({
          id: 'ord-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
          orderNumber,
          customerEmail,
          itemType: item.itemType,
          productId: item.productId || null,
          itemTitle: item.title,
          quantity: Number(item.quantity),
          unitRateBdt: Number(item.unitPriceBdt),
          totalAmountBdt: lineTotal,
          originalAmountBdt: lineOriginal,
          couponCode: appliedCoupon && lineDiscount > 0 ? appliedCoupon.code : null,
          couponDiscountBdt: lineDiscount,
          paymentMethodId: method.id,
          paymentMethodName: method.name,
          trxId,
          senderLast4,
          whatsappNumber,
          robloxUsername: item.requiresRobloxUsername ? robloxUser : null,
          discordUsername: (item.requiresDiscordTag || item.category === 'Discord Items') ? discordUser : null,
          status: 'Pending',
          internalNote: '',
          messages: [
            {
              id: 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
              senderRole: 'customer',
              senderName: customerEmail,
              text: `Order placed. WhatsApp for delivery: ${whatsappNumber}`,
              createdAt: nowStr,
            },
          ],
          createdAt: nowStr,
        });

        if (item.itemType === 'robux') {
          state.robux.robuxStock = Math.max(0, Number(state.robux.robuxStock) - Number(item.quantity));
        } else if (item.productId) {
          const prod = state.products.find((p) => p.id === item.productId);
          if (prod) {
            prod.stockQuantity = Math.max(0, Number(prod.stockQuantity) - Number(item.quantity));
          }
        }
      }

      if (appliedCoupon) {
        appliedCoupon.usedCount = Number(appliedCoupon.usedCount || 0) + 1;
      }
      state.appliedCouponCode = '';
      state.cart = [];
      saveState();
      showToast('Order submitted! Status is now Pending verification.', 'success');
      navigate('orders');
    }

    // ===== Owner-only: discounts & coupons actions =====
    function requireDiscountOwner() {
      if (!canManageDiscounts()) {
        showToast('Only the owner can manage discounts and coupons.', 'error');
        return false;
      }
      return true;
    }

    function parseDiscountPercent(raw) {
      const n = Math.round(Number(raw));
      if (!isFinite(n) || n < 0 || n > 95) return null;
      return n;
    }

    function saveProductDiscount(productId) {
      if (!requireDiscountOwner()) return;
      const prod = state.products.find((p) => p.id === productId);
      if (!prod) return;
      const d = parseDiscountPercent(document.getElementById(`disc-${productId}`)?.value || 0);
      if (d === null) {
        showToast('Discount must be between 0 and 95%.', 'error');
        return;
      }
      prod.discountPercent = d;
      syncCartPrices();
      saveState();
      showToast(d ? `${prod.title}: ${d}% discount saved.` : `${prod.title}: discount removed.`, 'success');
      render();
    }

    function applyDiscountToAllProducts() {
      if (!requireDiscountOwner()) return;
      const raw = document.getElementById('bulkDiscountInput')?.value;
      const d = raw === '' || raw === undefined ? null : parseDiscountPercent(raw);
      if (d === null) {
        showToast('Enter a discount between 0 and 95%.', 'error');
        return;
      }
      state.products.forEach((p) => { p.discountPercent = d; });
      syncCartPrices();
      saveState();
      showToast(`${d}% discount applied to all ${state.products.length} products.`, 'success');
      render();
    }

    function clearAllProductDiscounts() {
      if (!requireDiscountOwner()) return;
      state.products.forEach((p) => { p.discountPercent = 0; });
      syncCartPrices();
      saveState();
      showToast('All product discounts removed.', 'success');
      render();
    }

    function createCoupon(e) {
      e.preventDefault();
      if (!requireDiscountOwner()) return;
      const code = normalizeCouponCode(document.getElementById('newCouponCode')?.value);
      const type = document.getElementById('newCouponType')?.value === 'fixed' ? 'fixed' : 'percent';
      const value = Math.round(Number(document.getElementById('newCouponValue')?.value));
      const maxUses = Math.max(0, Math.round(Number(document.getElementById('newCouponMaxUses')?.value || 0)) || 0);
      if (!isValidCouponCode(code)) {
        showToast('Coupon code must be 3–24 letters, numbers, - or _.', 'error');
        return;
      }
      if (findCouponByCode(code)) {
        showToast(`Coupon ${code} already exists.`, 'error');
        return;
      }
      if (!isFinite(value) || value < 1 || (type === 'percent' && value > 100)) {
        showToast(type === 'percent' ? 'Percent must be between 1 and 100.' : 'Amount must be at least ৳1.', 'error');
        return;
      }
      if (!Array.isArray(state.coupons)) state.coupons = [];
      state.coupons.unshift({
        id: 'cp-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        code,
        type,
        value,
        maxUses,
        usedCount: 0,
        isActive: true,
        createdAt: new Date().toISOString().slice(0, 16).replace('T', ' '),
        createdBy: state.currentUser ? state.currentUser.email : '',
      });
      saveState();
      showToast(`Coupon ${code} added.`, 'success');
      render();
    }

    function renameCoupon(couponId) {
      if (!requireDiscountOwner()) return;
      const cp = (state.coupons || []).find((c) => c.id === couponId);
      if (!cp) return;
      const newCode = normalizeCouponCode(document.getElementById(`couponRename-${couponId}`)?.value);
      if (!isValidCouponCode(newCode)) {
        showToast('Coupon code must be 3–24 letters, numbers, - or _.', 'error');
        return;
      }
      if (newCode === normalizeCouponCode(cp.code)) {
        showToast('That is already the coupon name.', 'error');
        return;
      }
      const clash = findCouponByCode(newCode);
      if (clash && clash.id !== cp.id) {
        showToast(`Coupon ${newCode} already exists.`, 'error');
        return;
      }
      const oldCode = cp.code;
      cp.code = newCode;
      if (normalizeCouponCode(state.appliedCouponCode) === normalizeCouponCode(oldCode)) {
        state.appliedCouponCode = newCode;
      }
      saveState();
      showToast(`Coupon ${oldCode} renamed to ${newCode}.`, 'success');
      render();
    }

    function toggleCouponActive(couponId) {
      if (!requireDiscountOwner()) return;
      const cp = (state.coupons || []).find((c) => c.id === couponId);
      if (!cp) return;
      cp.isActive = !cp.isActive;
      saveState();
      showToast(`Coupon ${cp.code} ${cp.isActive ? 'activated' : 'paused'}.`, 'success');
      render();
    }

    function deleteCoupon(couponId) {
      if (!requireDiscountOwner()) return;
      const cp = (state.coupons || []).find((c) => c.id === couponId);
      if (!cp) return;
      if (!confirm(`Remove coupon ${cp.code}? Customers will no longer be able to use it.`)) return;
      state.coupons = state.coupons.filter((c) => c.id !== couponId);
      if (normalizeCouponCode(state.appliedCouponCode) === normalizeCouponCode(cp.code)) {
        state.appliedCouponCode = '';
      }
      saveState();
      showToast(`Coupon ${cp.code} removed.`, 'success');
      render();
    }

      window.__couponModalOpen = true;
      render();
      setTimeout(() => document.getElementById('modalCouponInput')?.focus(), 30);

    function closeCouponModal() {

      const cp = getAppliedCoupon();
      return `
        <div class="fixed inset-0 z-[60] bg-slate-950/50 backdrop-blur-sm flex items-center justify-center p-4" onclick="if (event.target === this) closeCouponModal()">
          <div class="w-full max-w-sm bg-white rounded-[22px] border border-slate-200 p-5 soft-shadow space-y-4" role="dialog" aria-label="Redeem coupon">
            <div class="flex items-center justify-between">
              <h2 class="font-display font-extrabold text-lg text-slate-950">🏷️ Redeem Coupon</h2>
              <button type="button" onclick="closeCouponModal()" class="text-slate-400 hover:text-slate-700 text-lg" aria-label="Close">✕</button>
            </div>
            ${cp ? `

                <button type="button" onclick="removeCheckoutCoupon()" class="h-10 px-4 rounded-xl border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold">Remove</button>
              </div>

                <button type="submit" class="px-4 h-10 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold">Redeem</button>
              </form>
            `}
          </div>
        </div>
      `;

    // Customer: redeem a coupon (checkout box or the top bar popup)
    function applyCheckoutCoupon(e, inputId = 'checkoutCouponInput') {
      if (e) e.preventDefault();
      const code = normalizeCouponCode(document.getElementById(inputId)?.value);
      if (!code) {
        showToast('Enter a coupon code.', 'error');
        return;
      }
      const cp = findCouponByCode(code);
      if (!cp || !cp.isActive) {
        showToast('This coupon code is not valid.', 'error');
        return;
      }
      if (!isCouponUsable(cp)) {
        showToast('This coupon has reached its usage limit.', 'error');
        return;
      }
      state.appliedCouponCode = cp.code;
      saveState();
      showToast(`Coupon ${cp.code} applied — ${describeCoupon(cp)}!`, 'success');
      render();
    }

    function removeCheckoutCoupon() {
      state.appliedCouponCode = '';
      saveState();
      render();
    }

      if (!canAccessAdminTab(tab)) {
        showToast('Access denied for your current role.', 'error');
        return;
      }
      state.activeAdminTab = tab;
      saveState();
      render();
    }

      if (kind === 'status') window.__adminOrderStatusFilter = value;
      renderKeepingInput();

    function updateOrderStatus(orderId, newStatus) {
      if (!isStaffSession()) {
        showToast('Staff login required.', 'error');
        return;
      }
      if (!Array.isArray(state.orders)) state.orders = [];
      const order = state.orders.find((o) => o.id === orderId);
      if (!order) return;
      order.status = newStatus;
      saveState();
      showToast(`Order ${order.orderNumber} updated to ${newStatus}.`, 'success');

    function sendOrderMessage(e, orderId, actorType = 'customer') {
      e.preventDefault();
      if (actorType === 'staff' && !isStaffSession()) {
        showToast('Staff login required to reply as staff.', 'error');
        return;
      }
      const inputId = actorType === 'staff' ? `staffOrderMsg_${orderId}` : `customerOrderMsg_${orderId}`;
      const inputEl = document.getElementById(inputId);
      const text = (inputEl?.value || '').trim();
      if (!text) {
        showToast('Please type a message first.', 'error');
        return;
      }
      const order = state.orders.find((o) => o.id === orderId);
      if (!order) return;
      if (!Array.isArray(order.messages)) order.messages = [];
      const nowStr = new Date().toISOString().slice(0, 16).replace('T', ' ');
      const senderRole = actorType === 'staff' ? (state.activeRole || 'admin') : 'customer';
      const senderName =
        actorType === 'staff'
          ? ((state.currentUser && state.currentUser.email) || `Staff (${senderRole})`)
          : ((state.currentUser && state.currentUser.email) || 'Customer');

      order.messages.push({
        id: 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
        senderRole,
        senderName,
        text,
        createdAt: nowStr,
      });
      saveState();
      showToast(actorType === 'staff' ? 'Reply sent to order!' : 'Message sent on order!', 'success');
      render();
    }

    function handleNewProductLogoFile(inputEl) {
      const file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        window.__newProdLogoData = String(reader.result || '');
        const urlInput = document.getElementById('newProdLogo');
        if (urlInput) urlInput.value = window.__newProdLogoData;
        render();
      };
      reader.readAsDataURL(file);
    }

    function addMarketplaceProduct(e) {
      e.preventDefault();
      if (!canAccessAdminTab('marketplace')) {
        showToast('Access denied.', 'error');
        return;
      }
      const title = document.getElementById('newProdTitle').value.trim();
      const category = document.getElementById('newProdCategory').value;
      const priceBdt = Number(document.getElementById('newProdPrice').value);
      const stockQuantity = Number(document.getElementById('newProdStock').value);
      const ratingCount = Number(document.getElementById('newProdRatingCount').value || 0);
      const logoInput = (document.getElementById('newProdLogo')?.value || '').trim();
      const logoUrl = window.__newProdLogoData || logoInput;
      const description = document.getElementById('newProdDesc').value.trim();
      const statusInput = document.getElementById('newProdStatus')?.value || 'active';
      const status = PRODUCT_STATUSES.some((s) => s.id === statusInput) ? statusInput : 'active';

      if (!logoUrl) {
        showToast('Please upload a product logo or enter a Logo URL.', 'error');
        return;
      }

      state.products.unshift({
        id: 'prod-' + Date.now(),
        createdAt: Date.now(),
        title,
        category,
        priceBdt,
        stockQuantity,
        lowStockThreshold: 5,
        ratingCount,
        logoUrl,
        imageUrl: logoUrl,
        description,
        status,
        isActive: status !== 'inactive',
        isFeatured: true,
        requiresRobloxUsername: title.toLowerCase().includes('robux') || title.toLowerCase().includes('roblox'),
        requiresDiscordTag: category === 'Discord Items' || title.toLowerCase().includes('discord'),
      });
      window.__newProdLogoData = '';
      saveState();
      showToast('Product added to marketplace.', 'success');
      render();
    }

    function setProductStatus(productId, nextStatus) {
      if (!canAccessAdminTab('marketplace')) {
        showToast('Access denied.', 'error');
        return;
      }
      const p = state.products.find((x) => x.id === productId);
      if (!p) return;
      const status = PRODUCT_STATUSES.some((s) => s.id === nextStatus) ? nextStatus : 'active';
      p.status = status;
      p.isActive = status !== 'inactive';
      // Remove hidden / unsellable products from the cart so they can't be checked out
      if (status !== 'active' && Array.isArray(state.cart)) {
        state.cart = state.cart.filter((i) => i.productId !== productId);
      }
      if (document.activeElement && typeof document.activeElement.blur === 'function') {
        document.activeElement.blur();
      }
      saveState();
      const label = (PRODUCT_STATUSES.find((s) => s.id === status) || {}).label || status;
      showToast(`${p.title} is now: ${label}`, 'success');
    }

    function handleCategoryLogoFile(inputEl, draftKey, targetInputId) {
      if (!canManageCategories()) {
        showToast('Only the Owner can upload category logos.', 'error');
        return;
      }
      const file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUri = String(reader.result || '');
        window[draftKey] = dataUri;
        const targetInput = document.getElementById(targetInputId);
        if (targetInput) targetInput.value = dataUri;
        render();
      };
      reader.readAsDataURL(file);
    }

    function createCategory(e) {
      e.preventDefault();

      const description = (document.getElementById('newCatDesc')?.value || '').trim();

      state.categories.push({
        id: 'cat-' + Date.now(),
        createdAt: Date.now(),
        name,
        subtitle,
        description,
        logoUrl,
        route: null,
      });

      showToast(`Created category "${name}".`, 'success');
      render();

    function saveCategoryEdits(catId) {
      if (!canManageCategories()) {
        showToast('Only the Owner can edit categories.', 'error');
        return;
      }
      const cat = (state.categories || []).find((c) => c.id === catId);
      if (!cat) return;

      const oldName = cat.name;
      const nextName = (document.getElementById(`catTitle_${catId}`)?.value || '').trim();
      const nextSub = (document.getElementById(`catSub_${catId}`)?.value || '').trim();
      const nextDesc = (document.getElementById(`catDesc_${catId}`)?.value || '').trim();
      const nextLogo = (document.getElementById(`catLogo_${catId}`)?.value || '').trim() || cat.logoUrl || ITEM_LOGOS.nitroBasic;

      if (!nextName) {
        showToast('Category title cannot be empty.', 'error');
        return;
      }

      cat.name = nextName;
      cat.subtitle = nextSub;
      cat.description = nextDesc;
      cat.logoUrl = nextLogo;
      delete window[`__catLogoDraft_${catId}`];

      if (oldName !== nextName) {
        state.products.forEach((p) => {
          if (p.category === oldName) p.category = nextName;
        });
        if (state.selectedCategory === oldName) {
          state.selectedCategory = nextName;
        }
      }

      saveState();
      showToast(`Saved changes for "${nextName}".`, 'success');
      render();
    }

    function deleteCategory(catId) {

    function applyQuickStockTimer(minutes) {
      if (!minutes || minutes <= 0) {
        state.robux.restockAt = '';
        saveState();
        showToast('Stock timer cleared.', 'success');
        render();
        return;
      }
      const future = new Date(Date.now() + minutes * 60 * 1000);
      const localIso = new Date(future.getTime() - future.getTimezoneOffset() * 60000)
        .toISOString()
        .slice(0, 16);
      state.robux.restockAt = localIso;
      saveState();
      showToast(`Stock timer set for +${minutes}m.`, 'success');
      render();
    }

    // Support contact helpers
    function normalizeDiscordUrl(raw) {
      let v = String(raw || '').trim();
      if (!v) return '';
      if (!/^https?:\/\//i.test(v)) v = 'https://' + v.replace(/^\/+/, '');
      try {
        const u = new URL(v);
        if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
        return u.toString();
      } catch (err) {
        return null;
      }
    }

    function getWhatsappDigits(raw) {
      return String(raw || '').replace(/[^0-9]/g, '');
    }

    function getWhatsappLink() {
      const s = state.support || {};
      const digits = getWhatsappDigits(s.whatsappNumber);
      if (!digits) return '';
      const msg = String(s.whatsappMessage || '').trim();
      return `https://wa.me/${digits}${msg ? `?text=${encodeURIComponent(msg)}` : ''}`;
    }

    function getDiscordLink() {
      const s = state.support || {};
      return normalizeDiscordUrl(s.discordUrl) || '';
    }

      };

    function assignRoleToUser(e) {
      e.preventDefault();
      if (!canAssignRoles()) {
        showToast('You do not have permission to assign roles.', 'error');
        return;
      }
      const email = normalizeEmail(document.getElementById('roleTargetEmail').value);
      const role = document.getElementById('roleTargetSelect').value;

      if (role === 'owner') {
        if (state.activeRole !== 'owner') {
          showToast('Only an Owner can assign the Owner role.', 'error');
          return;
        }
        if (!canReceiveOwnerRole(email)) {
          showToast(`Blocked: Authorized Owner lock is active (${getAuthorizedOwnerEmails().join(', ')}).`, 'error');
          return;
        }
      }

      let user = state.users.find((u) => normalizeEmail(u.email) === email);
      if (!user) {
        user = { id: 'u-' + Date.now(), email, fullName: role === 'owner' ? DEFAULT_OWNER_NAME : email.split('@')[0], roles: [], password: role === 'owner' ? DEFAULT_OWNER_PASSWORD : '' };
        state.users.push(user);
      }
      if (!Array.isArray(user.roles)) user.roles = [];
      if (!user.roles.includes(role)) {
        user.roles.push(role);
      }
      if (role === 'owner') {
        user.fullName = DEFAULT_OWNER_NAME;
        if (!user.password) user.password = DEFAULT_OWNER_PASSWORD;
      }
      if (!state.approvedGmails.includes(email)) {
        state.approvedGmails.push(email);
      }
      saveState();
      if (supabaseClient) {
        supabaseClient.from('store_staff').upsert({ email, role }, { onConflict: 'email,role', ignoreDuplicates: true })
          .then(({ error }) => { if (error) showToast(`Role not saved online: ${error.message}`, 'error'); });
      }
      showToast(`Assigned ${role} role to ${email}.`, 'success');
      render();
    }

    function toggleExclusiveOwnerLock() {
      if (state.activeRole !== 'owner') {
        showToast('Only the Owner can change the Owner lock setting.', 'error');
        return;

      state.exclusiveOwnerOnlyMe = !state.exclusiveOwnerOnlyMe;
      if (state.exclusiveOwnerOnlyMe) {
        const authorizedList = getAuthorizedOwnerEmails();
        state.exclusiveOwnerEmails = authorizedList;
        state.users.forEach((u) => {
          if (Array.isArray(u.roles) && u.roles.includes('owner') && !authorizedList.includes(normalizeEmail(u.email))) {
            u.roles = u.roles.filter((r) => r !== 'owner');
          }
        });
      }
      saveState();
      showToast(
        state.exclusiveOwnerOnlyMe
          ? 'Owner role locked to authorized owner accounts.'
          : 'Exclusive Owner lock turned off.',
        'success'
      );
      render();
    }

    function saveExclusiveOwnerEmail() {
      if (state.activeRole !== 'owner') {
        showToast('Only the Owner can update authorized Owner emails.', 'error');
        return;
      }
      const rawVal = document.getElementById('exclusiveOwnerEmailInput')?.value || '';
      const parsedEmails = Array.from(
        new Set(
          rawVal
            .split(/[\n,;]+/)
            .map((e) => normalizeEmail(e))
            .filter(Boolean)
        )
      );
      if (!parsedEmails.length) {
        showToast('Enter at least one owner email address.', 'error');
        return;
      }
      if (!Array.isArray(state.users)) state.users = [];
      state.exclusiveOwnerEmails = parsedEmails;
      state.exclusiveOwnerEmail = parsedEmails[0];
      state.exclusiveOwnerOnlyMe = true;

      parsedEmails.forEach((em) => {
        let ownerUser = state.users.find((u) => normalizeEmail(u.email) === em);
        if (!ownerUser) {
          state.users.unshift({ id: 'u-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5), email: em, fullName: DEFAULT_OWNER_NAME, roles: ['owner'], password: DEFAULT_OWNER_PASSWORD });
        } else {
          if (!Array.isArray(ownerUser.roles)) ownerUser.roles = [];
          if (!ownerUser.roles.includes('owner')) ownerUser.roles.push('owner');
          ownerUser.fullName = DEFAULT_OWNER_NAME;
          if (!ownerUser.password) ownerUser.password = DEFAULT_OWNER_PASSWORD;
        }
      });

      state.users.forEach((u) => {
        if (!parsedEmails.includes(normalizeEmail(u.email)) && Array.isArray(u.roles) && u.roles.includes('owner')) {
          u.roles = u.roles.filter((r) => r !== 'owner');
        }
      });
      saveState();
      showToast(`Owner role locked to: ${parsedEmails.join(', ')}`, 'success');
      render();
    }



    function revokeRoleFromUser(userId, role) {
      if (!isStaffSession() || state.activeRole !== 'owner') {
        showToast('Only the Owner can change user roles.', 'error');
        return;
      }
      const user = state.users.find((u) => u.id === userId);
      if (!user || !Array.isArray(user.roles)) return;
      user.roles = user.roles.filter((r) => r !== role);
      saveState();
      if (supabaseClient) {
        supabaseClient.from('store_staff').delete().eq('email', normalizeEmail(user.email)).eq('role', role)
          .then(({ error }) => { if (error) showToast(`Role not removed online: ${error.message}`, 'error'); });
      }
      showToast(`Removed ${role} from ${user.email}.`, 'success');
      render();
    }

        showToast('Only the Owner can remove user accounts.', 'error');

      }
      showToast(`Removed ${target.email}.`, 'success');
      render();
    }

    async function signInWithGoogle() {
      const enteredEmail = normalizeEmail(document.getElementById('authEmail')?.value || '');
      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + window.location.pathname },
          });
          if (error) {
            showToast(error.message, 'error');
          }
          return;
        } catch {
          showToast('Google OAuth request failed.', 'error');
          return;
        }
      }

      if (!enteredEmail || !isValidGmailAddress(enteredEmail)) {
        showToast('Enter a valid @gmail.com address to continue with Google.', 'error');
        return;
      }

      let existing = (state.users || []).find((u) => normalizeEmail(u.email) === enteredEmail);
      if (!existing) {
        if (state.requireApprovedGmailForSignup && !isApprovedGmailForSignup(enteredEmail)) {
          showToast(`"${enteredEmail}" is not in the approved Gmail list.`, 'error');
          return;
        }
        existing = { id: 'u-' + Date.now(), email: enteredEmail, fullName: enteredEmail.split('@')[0], roles: [], password: '' };
        state.users.push(existing);
      }

      const roles = Array.isArray(existing.roles) ? existing.roles : [];
      if (state.exclusiveOwnerOnlyMe && roles.includes('owner') && !canReceiveOwnerRole(existing.email)) {
        existing.roles = roles.filter((r) => r !== 'owner');
      }
      const effectiveRoles = Array.isArray(existing.roles) ? existing.roles : [];

      state.currentUser = { email: existing.email, fullName: existing.fullName };
      if (effectiveRoles.includes('owner') && canReceiveOwnerRole(existing.email)) state.activeRole = 'owner';
      else if (effectiveRoles.includes('admin')) state.activeRole = 'admin';
      else if (effectiveRoles.includes('stock_manager')) state.activeRole = 'stock_manager';
      else if (effectiveRoles.includes('order_manager')) state.activeRole = 'order_manager';
      else state.activeRole = 'customer';

      state.authModal = null;
      saveState();
      showToast(`Signed in with Google as ${existing.email}.`, 'success');
      render();
    }

    async function handleAuthSubmit(e, mode) {
      e.preventDefault();
      const email = normalizeEmail(document.getElementById('authEmail').value);
      const password = document.getElementById('authPassword').value;
      const fullName = mode === 'signup' ? document.getElementById('authFullName').value.trim() : email.split('@')[0];

      if (mode === 'signup') {
        const status = getSignupGmailStatus(email);
        if (!status.ok && (state.users || []).some((u) => normalizeEmail(u.email) === email)) {
          openAuthModal('login', email);
          showToast(`"${email}" already has an account — please log in.`, 'error');
          return;
        }
        if (!status.ok) {
          refreshLiveAuthStatus();
          showToast(status.message.replace(/^✗\s*/, ''), 'error');
          return;
        }
      } else {
        const loginStatus = getLoginGmailStatus(email);
        if (!loginStatus.ok && !supabaseClient) {
          const unknownAccount = email && !(state.users || []).some((u) => normalizeEmail(u.email) === email);
          if (unknownAccount) {
            openAuthModal('signup', email);
            showToast(`No account for "${email}" yet — create one here.`, 'error');
            return;
          }
          refreshLiveAuthStatus();
          showToast(loginStatus.message.replace(/^✗\s*/, ''), 'error');
          return;
        }
      }

      if (supabaseClient) {
        try {
          const res =
            mode === 'signup'
              ? await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: fullName } } })
              : await supabaseClient.auth.signInWithPassword({ email, password });
          if (res.error) {
            showToast(res.error.message, 'error');
            return;
          }
          if (mode === 'signup' && !(res.data && res.data.session)) {
            state.authModal = 'login';
            render();
            showToast(`Check ${email} and click the confirmation link, then log in.`, 'success');
            return;
          }
        } catch (err) {
          showToast('Login service request failed.', 'error');
          return;
        }
      }

      let existing = state.users.find((u) => normalizeEmail(u.email) === email);
      if (!existing && supabaseClient && mode !== 'signup') {
        existing = { id: 'u-' + Date.now(), email, fullName, roles: [], password: '' };
        state.users.push(existing);
      }
      if (!existing) {
        if (mode !== 'signup') {
          openAuthModal('signup', email);
          showToast(`Account for "${email}" does not exist. Please sign up first.`, 'error');
          return;
        }
        existing = { id: 'u-' + Date.now(), email, fullName, roles: [], password };
        state.users.push(existing);
      } else {
        const rolesArr = Array.isArray(existing.roles) ? existing.roles : [];
        const isOwnerAccount = rolesArr.includes('owner');
        const expectedPassword = existing.password || (isOwnerAccount ? DEFAULT_OWNER_PASSWORD : '');
        if (mode !== 'signup' && !supabaseClient) {
          if (!expectedPassword || password !== expectedPassword) {
            showToast('Wrong password! Login blocked.', 'error');
            return;
          }
        } else if (fullName) {
          existing.fullName = fullName;
          existing.password = password;
        }
      }

      const rolesAfter = Array.isArray(existing.roles) ? existing.roles : [];
      if (state.exclusiveOwnerOnlyMe && rolesAfter.includes('owner') && !canReceiveOwnerRole(existing.email)) {
        existing.roles = rolesAfter.filter((r) => r !== 'owner');
      }
      const effectiveRoles = Array.isArray(existing.roles) ? existing.roles : [];

      state.currentUser = { email: existing.email, fullName: existing.fullName };
      if (effectiveRoles.includes('owner') && canReceiveOwnerRole(existing.email)) state.activeRole = 'owner';
      else if (effectiveRoles.includes('admin')) state.activeRole = 'admin';
      else if (effectiveRoles.includes('stock_manager')) state.activeRole = 'stock_manager';
      else if (effectiveRoles.includes('order_manager')) state.activeRole = 'order_manager';
      else state.activeRole = 'customer';

      state.authModal = null;
      saveState();
      showToast(`Signed in as ${existing.email} (${state.activeRole}).`, 'success');
      render();
      refreshStaffRoleFromDb();
    }

    function copyText(text, successMsg) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch {
        // Fallback if clipboard API is restricted
      }
      showToast(successMsg, 'success');
    }

    // Root render function
    function render() {
      try {
        const app = document.getElementById('app');
        if (!app) return;
        const isPcMode = state.viewMode === 'pc';
        // Entrance animations play only when a different page opens, not when the same page updates
        const samePage = window.__bvLastRenderedRoute === state.activeRoute;
        window.__bvLastRenderedRoute = state.activeRoute;
        app.className = (isPcMode
          ? 'flex-1 flex flex-col w-full min-w-[1280px]'
          : 'flex-1 flex flex-col w-full max-w-full overflow-x-hidden') + (samePage ? ' bv-static' : '');
        let bodyHtml = '';
        if (state.activeRoute === 'home') bodyHtml = renderHomePage();
        else if (state.activeRoute === 'robux') bodyHtml = renderRobuxPage();
        else if (state.activeRoute === 'fivem') bodyHtml = renderFivemPage();
        else if (state.activeRoute === 'discord') bodyHtml = renderDiscordPage();
        else if (state.activeRoute === 'marketplace') bodyHtml = renderMarketplacePage();
        else if (state.activeRoute === 'product') bodyHtml = renderProductDetailPage();
        else if (state.activeRoute === 'checkout') bodyHtml = renderCheckoutPage();
        else if (state.activeRoute === 'orders') bodyHtml = renderOrdersPage();
        else if (state.activeRoute === 'support') bodyHtml = renderSupportPage();
        else if (state.activeRoute === 'admin') bodyHtml = renderAdminPage();
        else bodyHtml = renderHomePage();

        app.innerHTML = renderNavbar() + bodyHtml + renderFooter() + renderModalsAndToast() + renderCouponModal();
      } catch (err) {
        console.error('Render error:', err);
      }
    }

    // Live countdown ticker: only updates the timer text, never redraws the whole page
    setInterval(() => {
      state.nowTick = Date.now();
      if (!state.robux.restockAt) return;
      const text = getRestockCountdownText();
      document.querySelectorAll('[data-bv-countdown]').forEach((el) => {
        if (el.textContent !== text) el.textContent = text;
      });
    }, 1000);

    // ===== Audit log: records every staff/admin/owner change =====
    const AUDIT_MAX_ENTRIES = 2000;

    function formatAuditTime(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso || '');
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function addAuditEntry(action, details, severity = 'info', actor) {
      if (!Array.isArray(state.auditLog)) state.auditLog = [];
      const who = actor || {
        email: (state.currentUser && state.currentUser.email) || 'unknown',
        role: state.activeRole || 'unknown',
      };
      state.auditLog.unshift({
        id: 'audit-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        at: new Date().toISOString(),
        actorEmail: who.email,
        actorRole: who.role,
        action,
        details: String(details || ''),
        severity,
      });
      if (state.auditLog.length > AUDIT_MAX_ENTRIES) state.auditLog.length = AUDIT_MAX_ENTRIES;
      saveState();
    }

    function auditSnapshot() {
      return JSON.stringify({
        products: state.products, categories: state.categories, orders: state.orders,
        paymentMethods: state.paymentMethods, robux: state.robux, users: state.users,
        support: state.support, coupons: state.coupons, approvedGmails: state.approvedGmails,
        exclusiveOwnerOnlyMe: state.exclusiveOwnerOnlyMe, exclusiveOwnerEmails: state.exclusiveOwnerEmails,
        exclusiveOwnerEmail: state.exclusiveOwnerEmail, requireApprovedGmailForSignup: state.requireApprovedGmailForSignup,
        supabaseUrl: state.supabaseUrl, supabaseAnonKey: state.supabaseAnonKey,
      });
    }

    const byId = (list, id) => (Array.isArray(list) ? list.find((x) => x.id === id) : null) || null;
    const statusLabel = (s) => ((typeof PRODUCT_STATUSES !== 'undefined' && PRODUCT_STATUSES.find((x) => x.id === s)) || {}).label || s;

    // fn name → how to describe it. Each returns [action, details, severity]; b = state before, a = state after.
    const AUDIT_HOOKS = {
      updateOrderStatus: ([orderId, next], b) => {
        const o = byId(b.orders, orderId);
        return ['Order status changed', `${o ? o.orderNumber : orderId} (${o ? o.itemTitle : ''}, ${o ? formatBDT(o.totalAmountBdt) : ''}): ${o ? o.status : '?'} → ${next}`, next === 'Completed' || next === 'Rejected' ? 'warning' : 'info'];
      },
      sendOrderMessage: ([, orderId], b, a) => {
        const o = byId(a.orders, orderId);
        const m = o && o.messages ? o.messages[o.messages.length - 1] : null;
        return ['Replied on order', `${o ? o.orderNumber : orderId}: "${m ? String(m.text).slice(0, 120) : ''}"`, 'info'];
      },
      addMarketplaceProduct: (args, b, a) => {
        const added = a.products.find((p) => !byId(b.products, p.id));
        return ['Product added', added ? `"${added.title}" (${added.category}) at ${formatBDT(added.priceBdt)}, stock ${added.stockQuantity}` : 'New product', 'info'];
      },
      setProductStatus: ([id, next], b) => {
        const p = byId(b.products, id);
        return ['Product status changed', `"${p ? p.title : id}": ${p ? statusLabel(getProductStatus(p)) : '?'} → ${statusLabel(next)}`, 'info'];
      },
      deleteProduct: ([id], b) => {
        const p = byId(b.products, id);
        return ['Product deleted', `"${p ? p.title : id}" (${p ? formatBDT(p.priceBdt) : ''}, stock ${p ? p.stockQuantity : '?'})`, 'danger'];
      },
      createCategory: (args, b, a) => {
        const c = a.categories.find((x) => !byId(b.categories, x.id));
        return ['Category added', c ? `"${c.name}"` : 'New category', 'info'];
      },
      saveCategoryEdits: ([id], b, a) => {
        const o = byId(b.categories, id), n = byId(a.categories, id);
        return ['Category edited', o && n && o.name !== n.name ? `"${o.name}" renamed to "${n.name}"` : `"${n ? n.name : id}" details updated`, 'info'];
      },
      deleteCategory: ([id], b) => {
        const c = byId(b.categories, id);
        return ['Category deleted', `"${c ? c.name : id}"`, 'danger'];
      },
      saveRobuxStockSettings: (args, b, a) => ['Robux stock updated', `Stock ${Number(b.robux.robuxStock).toLocaleString('en-US')} → ${Number(a.robux.robuxStock).toLocaleString('en-US')}, low alert ${b.robux.lowStockThreshold} → ${a.robux.lowStockThreshold}, out of stock: ${a.robux.forceOutOfStock ? 'yes' : 'no'}`, 'info'],
      toggleRobuxOutOfStockQuick: (args, b, a) => ['Robux out-of-stock switched', a.robux.forceOutOfStock ? 'Robux marked Out of Stock' : 'Robux back in stock', 'info'],
      applyQuickStockTimer: ([m]) => ['Robux restock timer', m > 0 ? `Set to +${m} minutes` : 'Timer cleared', 'info'],
      saveProductStockAndRating: ([id], b, a) => {
        const o = byId(b.products, id) || {}, n = byId(a.products, id) || {};
        const ratingChanged = Number(o.ratingCount) !== Number(n.ratingCount);
        return ['Stock / rating changed', `"${n.title || id}": stock ${o.stockQuantity} → ${n.stockQuantity}, rating count ${o.ratingCount} → ${n.ratingCount}`, ratingChanged ? 'warning' : 'info'];
      },
      savePaymentMethod: ([id], b, a) => {
        const o = byId(b.paymentMethods, id) || {}, n = byId(a.paymentMethods, id) || {};
        const numChanged = o.receivingNumber !== n.receivingNumber;
        const parts = [];
        if (numChanged) parts.push(`receiving number ${o.receivingNumber || '—'} → ${n.receivingNumber || '—'}`);
        if (o.isEnabled !== n.isEnabled) parts.push(n.isEnabled ? 'enabled' : 'disabled');
        if (o.accountType !== n.accountType) parts.push(`type ${o.accountType} → ${n.accountType}`);
        if (o.instructionNote !== n.instructionNote) parts.push('instructions edited');
        return ['Payment method changed', `${n.name || id}: ${parts.join(', ') || 'saved'}`, numChanged ? 'danger' : 'warning'];
      },
      saveSupportSettings: () => ['Support settings changed', 'Support text / Discord / WhatsApp updated', 'info'],
      updateRobuxRate: (args, b, a) => ['Robux price changed', `${formatBDT(b.robux.ratePerRobux)} → ${formatBDT(a.robux.ratePerRobux)} per Robux`, 'warning'],
      assignRoleToUser: (args, b, a) => {
        const changed = a.users.find((u) => {
          const o = byId(b.users, u.id);
          return !o || (u.roles || []).length !== (o.roles || []).length;
        });
        const o = changed ? byId(b.users, changed.id) : null;
        const newRoles = changed ? (changed.roles || []).filter((r) => !(o && (o.roles || []).includes(r))) : [];
        return ['Role given', `${newRoles.join(', ') || 'role'} → ${changed ? changed.email : '?'}`, newRoles.some((r) => r === 'owner' || r === 'admin') ? 'danger' : 'warning'];
      },
      revokeRoleFromUser: ([id, role], b) => {
        const u = byId(b.users, id);
        return ['Role removed', `${role} removed from ${u ? u.email : id}`, role === 'owner' || role === 'admin' ? 'danger' : 'warning'];
      },
      removeUserEntry: ([id], b) => {
        const u = byId(b.users, id);
        return ['User removed', `${u ? u.email : id} (${u && u.roles && u.roles.length ? u.roles.join(', ') : 'customer'})`, 'danger'];
      },
      toggleExclusiveOwnerLock: (args, b, a) => ['Owner lock switched', a.exclusiveOwnerOnlyMe ? 'Owner lock turned ON' : 'Owner lock turned OFF', 'danger'],
      saveExclusiveOwnerEmail: (args, b, a) => ['Authorized owner emails changed', (a.exclusiveOwnerEmails || []).join(', '), 'danger'],
      saveSupabaseConfig: () => ['Login connection settings changed', 'Supabase URL / key updated', 'danger'],
      saveProductDiscount: ([id], b, a) => {
        const o = byId(b.products, id) || {}, n = byId(a.products, id) || {};
        return ['Product discount changed', `"${n.title || id}": ${Number(o.discountPercent || 0)}% → ${Number(n.discountPercent || 0)}%`, Number(n.discountPercent || 0) >= 50 ? 'warning' : 'info'];
      },
      applyDiscountToAllProducts: (args, b, a) => {
        const d = Number((a.products[0] || {}).discountPercent || 0);
        return ['Discount on ALL products', `${d}% applied to ${a.products.length} products`, d >= 50 ? 'danger' : 'warning'];
      },
      clearAllProductDiscounts: () => ['All discounts removed', 'Every product back to full price', 'info'],
      createCoupon: (args, b, a) => {
        const c = a.coupons.find((x) => !byId(b.coupons, x.id));
        return ['Coupon added', c ? `${c.code} (${describeCoupon(c)}, max uses ${Number(c.maxUses || 0) || '∞'})` : 'New coupon', c && c.type === 'percent' && Number(c.value) >= 50 ? 'warning' : 'info'];
      },
      renameCoupon: ([id], b, a) => ['Coupon renamed', `${(byId(b.coupons, id) || {}).code} → ${(byId(a.coupons, id) || {}).code}`, 'info'],
      toggleCouponActive: ([id], b, a) => {
        const c = byId(a.coupons, id) || {};
        return ['Coupon switched', `${c.code} ${c.isActive ? 'activated' : 'paused'}`, 'info'];
      },
      deleteCoupon: ([id], b) => ['Coupon removed', `${(byId(b.coupons, id) || {}).code || id}`, 'warning'],
    };

    function installAuditHooks() {
      Object.keys(AUDIT_HOOKS).forEach((name) => {
        const original = window[name];
        if (typeof original !== 'function') return;
        window[name] = function auditedAction(...args) {
          if (!isStaffSession()) return original.apply(this, args);
          const actor = { email: state.currentUser.email, role: state.activeRole };
          const beforeJson = auditSnapshot();
          const finish = () => {
            const afterJson = auditSnapshot();
            if (afterJson === beforeJson) return;
            try {
              const [action, details, severity] = AUDIT_HOOKS[name](args, JSON.parse(beforeJson), JSON.parse(afterJson));
              addAuditEntry(action, details, severity, actor);
            } catch (err) {
              addAuditEntry(name, 'Change recorded', 'warning', actor);
            }
            if (state.activeRoute === 'admin' && state.activeAdminTab === 'audit') render();
          };
          const result = original.apply(this, args);
          if (result && typeof result.then === 'function') return result.then((r) => { finish(); return r; });
          finish();
          return result;
        };
      });

      // Staff sign-ins and sign-outs
      const originalAuthSubmit = window.handleAuthSubmit;
      window.handleAuthSubmit = async function auditedAuth(...args) {
        const r = await originalAuthSubmit.apply(this, args);
        if (isStaffSession()) addAuditEntry('Staff signed in', `Signed in with ${state.activeRole} access`, 'info');
        return r;
      };
      const originalLogout = window.logoutUser;
      window.logoutUser = async function auditedLogout(...args) {
        if (isStaffSession()) addAuditEntry('Staff signed out', 'Logged out of the admin panel', 'info');
        return originalLogout.apply(this, args);
      };
    }

    function setAuditFilter(kind, value) {
      if (kind === 'actor') window.__auditActor = value;
      if (kind === 'severity') window.__auditSeverity = value;
      if (kind === 'search') window.__auditSearch = value;
      render();
    }

    function exportAuditLogCsv() {
      if (!(isStaffSession() && state.activeRole === 'owner')) {
        showToast('Only the Owner can download the audit log.', 'error');
        return;
      }
      const cell = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
      const lines = [['Time', 'Staff email', 'Role', 'Action', 'Details', 'Risk'].map(cell).join(',')];
      (state.auditLog || []).forEach((l) => {
        lines.push([formatAuditTime(l.at), l.actorEmail, l.actorRole, l.action, l.details, l.severity].map(cell).join(','));
      });
      const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `bluevolt-audit-log-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    installAuditHooks();
    render();
  </script>

  <script>
  (function(){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('bv-in');io.unobserve(e.target);}})},{threshold:.08,rootMargin:'0px 0px -30px 0px'});
    // Cards fade in only when a new page opens, never when the same page updates (e.g. picking a Robux amount)
    var lastAnimatedRoute=null;
    function enhance(){
      var app=document.getElementById('app'); if(!app) return;
      var route=(typeof state!=='undefined'&&state.activeRoute)||'';
      var samePage=route===lastAnimatedRoute; lastAnimatedRoute=route;
      app.querySelectorAll('.soft-shadow, .rounded-2xl.border, .rounded-3xl').forEach(function(el,i){
        if(el.dataset.bvDone||el.closest('header')||el.closest('.fixed')) return;
        el.dataset.bvDone='1';
        if(samePage){ el.classList.add('bv-card-anim'); return; }
        el.classList.add('bv-reveal','bv-card-anim');
        el.style.transitionDelay=((i%4)*60)+'ms';
        var r=el.getBoundingClientRect(); if(r.top<innerHeight){requestAnimationFrame(function(){el.classList.add('bv-in')})} else io.observe(el);
      });
      app.querySelectorAll('button.bg-brand-600').forEach(function(b){if(!b.closest('header'))b.classList.add('bv-shine')});
    }
    new MutationObserver(function(){requestAnimationFrame(enhance)}).observe(document.getElementById('app'),{childList:true,subtree:true});
    window.addEventListener('load',enhance); enhance();
  })();
  </script>

  <script>
  (function(){
    window.bvToggleSearch=function(){document.body.classList.toggle('bv-search-open');var i=document.getElementById('bv-search-input');if(document.body.classList.contains('bv-search-open')&&i)setTimeout(function(){i.focus()},50)};
    document.addEventListener('click',function(e){if(!e.target.closest('.bv-search,.bv-search-toggle'))document.body.classList.remove('bv-search-open')});
    var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    var pb=document.createElement('div');pb.id='bv-progress';document.body.appendChild(pb);
    addEventListener('scroll',function(){var h=document.documentElement.scrollHeight-innerHeight;pb.style.width=(h>0?scrollY/h*100:0)+'%'},{passive:true});
    if(reduce)return;
    var c=document.createElement('canvas');c.id='bv-canvas';document.body.prepend(c);var x=c.getContext('2d'),P=[];
    function sz(){c.width=innerWidth;c.height=innerHeight;P=[];var n=Math.min(70,Math.floor(innerWidth*innerHeight/18000));for(var i=0;i<n;i++)P.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*2+1})}
    sz();addEventListener('resize',sz);
    (function loop(){x.clearRect(0,0,c.width,c.height);for(var i=0;i<P.length;i++){var p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>c.width)p.vx*=-1;if(p.y<0||p.y>c.height)p.vy*=-1;x.fillStyle='rgba(29,112,245,.45)';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();for(var j=i+1;j<P.length;j++){var q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<120){x.strokeStyle='rgba(29,112,245,'+(.18*(1-d/120))+')';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}}requestAnimationFrame(loop)})();
    if(matchMedia('(pointer:fine)').matches){var g=document.createElement('div');g.id='bv-glow';document.body.prepend(g);addEventListener('mousemove',function(e){g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'})}
    document.addEventListener('mousemove',function(e){var el=e.target.closest&&e.target.closest('.bv-card-anim');document.querySelectorAll('.bv-tilt').forEach(function(t){if(t!==el){t.style.transform='';t.classList.remove('bv-tilt')}});if(!el)return;var r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;el.classList.add('bv-tilt');el.style.transform='perspective(800px) rotateY('+px*10+'deg) rotateX('+(-py*10)+'deg) translateY(-6px) scale(1.02)'});
    document.addEventListener('click',function(e){var b=e.target.closest('#app button');if(!b)return;var r=b.getBoundingClientRect();if(getComputedStyle(b).position==='static')b.style.position='relative';b.style.overflow='hidden';var s=document.createElement('span'),d=Math.max(r.width,r.height);s.className='bv-ripple';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';b.appendChild(s);setTimeout(function(){s.remove()},650);
      if(/cart/i.test(b.textContent)){var cs=['#1d70f5','#22d3ee','#a855f7','#facc15','#22c55e'];for(var i=0;i<14;i++){var k=document.createElement('span');k.className='bv-spark';var a=Math.random()*6.28,v=40+Math.random()*60;k.style.cssText='left:'+e.clientX+'px;top:'+e.clientY+'px;background:'+cs[i%5]+';--dx:'+Math.cos(a)*v+'px;--dy:'+Math.sin(a)*v+'px';document.body.appendChild(k);setTimeout(function(n){return function(){n.remove()}}(k),750)}}},true);
  })();
  </script>
